function getSess() {
  try { const s = JSON.parse(SESS_STORE.getItem('ss_sess') || 'null'); if (s && Date.now() - s.ts < 4 * 3600e3) return s; } catch (e) { }
  return null;
}
function saveSess() { try { SESS_STORE.setItem('ss_sess', JSON.stringify({ code: G.code, token: G.token, ts: Date.now() })); } catch (e) { } }
function clearSess() { try { SESS_STORE.removeItem('ss_sess'); } catch (e) { } }

UI.setLang = l => { setLang(l, true); if (NET_LOCAL) $('home-note').textContent = URLP.has('local') ? L('Modo de teste local (várias abas no mesmo browser).', 'Local test mode (several tabs in the same browser).') : L('Sem ligação ao servidor de jogo. Verifica a internet e recarrega a página.', 'No connection to the game server. Check your internet and reload the page.'); };
UI.goCreate = () => { SFX.unlock(); showView('v-create'); };
UI.goJoin = () => { SFX.unlock(); showView('v-join'); setTimeout(() => $('join-code').focus(), 50); };

function genCode() { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r = ''; for (let i = 0; i < 4; i++) r += c[Math.floor(Math.random() * c.length)]; return r; }

function startHosting(mode, done, tries) {
  tries = tries || 0;
  const code = genCode();
  G.peerHost = netHost(code, {
    ready() { G.code = code; engCreate(code, mode, LANG); ENG.onState = onState; done(code); },
    conn(L) { engOnConn(L); },
    error(type, msg) {
      if (type === 'taken' && tries < 5) return startHosting(mode, done, tries + 1);
      toast(msg || L('Não foi possível criar a sala.', 'Could not create the room.'));
      showView('v-home');
    }
  });
  window.addEventListener('beforeunload', e => { if (ENG.S && ENG.S.order.length) { e.preventDefault(); e.returnValue = ''; } });
}

UI.createTV = () => {
  SFX.unlock(); keepAwake();
  toast(L('A criar a sala…', 'Creating the room…'), true);
  startHosting('tv', () => {
    G.role = 'tv'; G.host = true; G.mode = 'tv';
    document.body.classList.add('is-tv');
    musicBtns();
    $('toast').classList.add('hidden');
    showView('v-tv');
    engPush();
  });
};
UI.createMesa = () => { SFX.unlock(); G.pendingMesa = true; openAvatar(); };

UI.connect = () => {
  const code = $('join-code').value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  $('join-code').value = code;
  if (code.length !== 4) { toast(L('O código tem 4 caracteres.', 'The code has 4 characters.')); return; }
  if (G.joining) return;
  G.joining = true;
  const b = $('btn-connect'); b.disabled = true; b.textContent = L('A ligar…', 'Connecting…');
  SFX.unlock();
  netJoin(code, {
    open(lk) { G.joining = false; G.link = lk; G.code = code; b.disabled = false; b.textContent = L('Ligar', 'Connect'); G.pendingMesa = false; openAvatar(); },
    data: onMsg,
    close: onLost,
    fail(msg) { G.joining = false; b.disabled = false; b.textContent = L('Ligar', 'Connect'); toast(msg); showView('v-join'); }
  });
};

UI.resume = () => {
  const s = getSess();
  if (!s) return;
  G.code = s.code; G.token = s.token;
  showView('v-join'); $('join-code').value = s.code;
  const b = $('btn-connect'); b.disabled = true; b.textContent = L('A voltar ao jogo…', 'Rejoining the game…');
  netJoin(s.code, {
    open(lk) { G.link = lk; b.disabled = false; b.textContent = L('Ligar', 'Connect'); lk.send({ t: 'J', token: s.token, name: G.av.name, anim: G.av.anim, acc: G.av.acc }); },
    data: onMsg,
    close: onLost,
    fail(msg) { b.disabled = false; b.textContent = L('Ligar', 'Connect'); toast(msg); clearSess(); $('btn-resume').classList.add('hidden'); }
  });
};

/* ---------- criação da personagem ---------- */
let avActor = null;
function openAvatar() {
  showView('v-avatar');
  $('av-name').value = G.av.name || '';
  const ga = $('av-animals'); ga.innerHTML = '';
  ANIMAL_IDS.forEach(id => {
    const b = document.createElement('button');
    b.className = 'pick' + (id === G.av.anim ? ' sel' : '');
    b.title = L(ANIMALS[id].nome, ANIMAL_EN[id]);
    b.appendChild(staticAv(id, 'nada', 'normal', 64, 84));
    b.onclick = () => { G.av.anim = id; ga.querySelectorAll('.pick').forEach(x => x.classList.toggle('sel', x === b)); refreshAccPicks(); avActor.set({ a: id }); avActor.play('saltar'); };
    ga.appendChild(b);
  });
  refreshAccPicks();
  const pv = $('av-preview'); pv.innerHTML = '';
  avActor = mountActor(pv, 6, G.av.anim, G.av.acc);
}
function refreshAccPicks() {
  const gc = $('av-accs'); gc.innerHTML = '';
  ACCS.forEach(([id, nome]) => {
    const b = document.createElement('button');
    b.className = 'pick' + (id === G.av.acc ? ' sel' : '');
    b.title = L(nome, ACC_EN[id]);
    if (id === 'nada') b.innerHTML = '<span class="none">' + L('NADA', 'NONE') + '</span>';
    else b.appendChild(staticAv(G.av.anim, id, 'normal', 64, 84));
    b.onclick = () => { G.av.acc = id; gc.querySelectorAll('.pick').forEach(x => x.classList.toggle('sel', x === b)); avActor.set({ ac: id }); avActor.play('virar'); };
    gc.appendChild(b);
  });
}
UI.avTrick = () => { if (avActor) avActor.play(TRICKS[Math.floor(Math.random() * TRICKS.length)]); };
UI.avReady = () => {
  const name = $('av-name').value.replace(/\s+/g, ' ').trim().slice(0, 12);
  if (!name) { toast(L('Escreve o teu nome!', 'Type your name!')); $('av-name').focus(); return; }
  G.av.name = name;
  try { localStorage.setItem('ss_av', JSON.stringify(G.av)); } catch (e) { }
  keepAwake();
  if (G.pendingMesa) {
    $('btn-ready').disabled = true;
    toast(L('A criar a sala…', 'Creating the room…'), true);
    startHosting('mesa', () => {
      $('btn-ready').disabled = false;
      $('toast').classList.add('hidden');
      G.role = 'ph'; G.host = true; G.mode = 'mesa';
      G.me = engAddLocal(G.av);
      $('ph-mus').classList.remove('hidden'); musicBtns();
      showView('v-ph');
      engPush();
    });
    return;
  }
  if (!G.link || !G.link.open) { toast(L('A ligação caiu. Tenta entrar outra vez.', 'The connection dropped. Try joining again.')); showView('v-join'); return; }
  $('btn-ready').disabled = true;
  G.link.send({ t: 'J', token: G.token, name: G.av.name, anim: G.av.anim, acc: G.av.acc });
  setTimeout(() => ($('btn-ready').disabled = false), 2000);
};

/* ---------- mensagens do anfitrião ---------- */
function onMsg(d) {
  if (!d) return;
  if (d.t === 'W') {
    G.me = d.pid; G.token = d.token; G.code = d.code; G.mode = d.mode;
    G.role = 'ph'; G.reconn = 0;
    saveSess();
    $('netbar').classList.add('hidden');
    showView('v-ph');
  } else if (d.t === 'S') {
    if (G.role === 'ph' && G.me) onState(d.s);
  } else if (d.t === 'E') {
    toast(ERR_TXT()[d.code] || d.msg || '');
    if (d.kick) { clearSess(); G.me = null; G.role = null; showView('v-home'); }
    else if (!G.me) { clearSess(); showView('v-join'); }
  }
}

// sinal de vida para o anfitrião saber que o telemóvel continua ligado
setInterval(() => { if (!G.host && G.me && G.link && G.link.open) G.link.send({ t: 'P' }); }, 4000);

function send(m) {
  if (G.host) { if (G.me) engMsg(G.me, m); }
  else if (G.link && G.link.open) G.link.send(m);
}
UI.hostAct = (a, d) => { if (G.host) { SFX.unlock(); engAction(a, d || {}); } };

function onLost() {
  if (G.host || !G.code) return;
  if (!G.me) { toast(L('A ligação falhou. Tenta outra vez.', 'Connection failed. Try again.')); showView('v-join'); return; }
  $('netbar').textContent = L('📡 Ligação perdida… a tentar voltar ao jogo', '📡 Connection lost… trying to rejoin');
  $('netbar').classList.remove('hidden');
  clearTimeout(G.reconnTimer);
  G.reconnTimer = setTimeout(reconnectNow, 1500);
}
function reconnectNow() {
  clearTimeout(G.reconnTimer);
  if (G.reconnBusy) return;
  G.reconnBusy = true;
  G.reconn++;
  netJoin(G.code, {
    open(lk) { G.reconnBusy = false; G.link = lk; lk.send({ t: 'J', token: G.token, name: G.av.name, anim: G.av.anim, acc: G.av.acc }); },
    data: onMsg,
    close: () => { G.reconnBusy = false; onLost(); },
    fail(msg) {
      G.reconnBusy = false;
      if (G.reconn < 25) { G.reconnTimer = setTimeout(reconnectNow, 3000); }
      else { $('netbar').innerHTML = L('Não foi possível voltar ao jogo.', 'Could not rejoin the game.') + ' <button class="btn btn-sm btn-ghost" onclick="location.href=location.pathname">' + L('Início', 'Home') + '</button>'; }
    }
  });
}

/* =========================================================
   RENDER
   ========================================================= */
function onState(S) {
  const P = G.S;
  G.S = S;
  // o anfitrião escolhe a língua; quando muda, tudo é redesenhado
  if (S.lang && S.lang !== LANG) { setLang(S.lang, false); G.keys = {}; musicBtns(); }
  if (G.role === 'tv') renderTV(S, P); else renderPh(S, P);
  handleFeed(S, P);
  if (G.role === 'tv' || (G.host && G.mode === 'mesa')) sounds(S, P);
}

function handleFeed(S, P) {
  const items = S.feed || [];
  if (G.seenFeed < 0 || !P) { G.seenFeed = items.length ? items[items.length - 1].id : 0; return; }
  for (const it of items) {
    if (it.id <= G.seenFeed) continue;
    G.seenFeed = it.id;
    const mine = it.a === G.me || it.b === G.me;
    const showIt = G.role === 'tv' || G.mode === 'mesa' || mine || it.kind === 'win' || it.kind === 'solo';
    if (showIt) showFeed(feedText(it, S));
    if (it.kind === 'roubo') { reactPid(it.a, 'saltar'); reactPid(it.b, 'atingido'); if (it.b === G.me) vib([80, 60, 80]); }
    if (it.kind === 'roubo0') reactPid(it.a, 'abanar');
    if (it.kind === 'ink' || it.kind === 'pie') reactPid(it.b, 'atingido');
    if (it.kind === 'elim') reactPid(it.a, 'cair', true);
    if (it.kind === 'win' || it.kind === 'solo') { /* o vencedor já dança */ }
    if (G.role === 'tv' || (G.host && G.mode === 'mesa')) {
      if (it.kind === 'roubo') SFX.play('coin');
      if (it.kind === 'ink' || it.kind === 'pie') SFX.play('splat');
      if (it.kind === 'elim') SFX.play('elim');
    }
  }
}
function showFeed(txt) {
  const f = $('feed');
  const d = document.createElement('div');
  d.className = 'feed-it'; d.textContent = txt;
  f.appendChild(d);
  while (f.children.length > 2) f.firstChild.remove();
  setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 450); }, 3200);
}

function sounds(S, P) {
  // música: calma nas rondas, tensa na final, festiva no fim
  MUSIC.setMood(['FINTRO', 'FQ', 'FREV'].includes(S.phase) ? 'tense' : S.phase === 'END' ? 'victory' : 'calm');
  if (MUSIC.on && !MUSIC.playing) MUSIC.start();
  if (!P) return;
  const ph = S.phase, pph = P.phase;
  if ((ph === 'Q' || ph === 'FQ') && pph !== ph) SFX.play('start');
  if ((ph === 'Q' || ph === 'FQ') && S.t !== P.t && S.t <= 3 && S.t > 0) SFX.play('tick');
  if ((ph === 'REVEAL' || ph === 'FREV') && pph !== ph) {
    const any = S.order.some(id => S.players[id] && S.players[id].last && S.players[id].last.ok);
    SFX.play(any ? 'ok' : 'bad');
  }
  if (ph === 'INTRO' && pph !== ph) SFX.play('round');
  if (ph === 'FINTRO' && pph !== ph) SFX.play('round');
  if (ph === 'END' && pph !== ph) SFX.play('win');
  if (ph === 'VOTE' && P.vote && S.vote && S.vote.cnt.join() !== P.vote.cnt.join()) SFX.play('vote');
}

/* ---------- bonecos: reações e expressões ---------- */
const ALL_ACTORS = []; // {pid, actor, ctx}
function regActor(pid, actor) { ALL_ACTORS.push({ pid, actor }); }
function reactPid(pid, anim, force) {
  for (let i = ALL_ACTORS.length - 1; i >= 0; i--) {
    const r = ALL_ACTORS[i];
    if (r.actor.dead) { ALL_ACTORS.splice(i, 1); continue; }
    if (r.pid === pid) r.actor.play(anim, force ? false : undefined);
  }
}
function exprFor(S, p) {
  if (!p.on) return 'dormir';
  if (S.fin && !p.alive) return 'triste';
  if (S.phase === 'END') return p.id === S.winner ? 'feliz' : 'normal';
  if (S.phase === 'FQ' || S.phase === 'FREV') return p.time <= 10 ? 'panico' : (p.ans ? 'normal' : 'pensar');
  if (S.phase === 'Q') return p.ans ? 'normal' : 'pensar';
  if (S.phase === 'ATTACK') return 'zangado';
  if (S.phase === 'BET') return 'pensar';
  return 'normal';
}
function syncActor(holder, S, p) {
  const a = holder.actor;
  a.set({
    a: p.anim, ac: p.acc, expr: exprFor(S, p),
    dim: !p.on || (S.fin && !p.alive),
    fx: S.phase === 'Q' && p.hit && !p.hit.cleared ? p.hit.w : null
  });
  // reação ao resultado
  let rk = null, anim = null;
  if ((S.phase === 'REVEAL' || S.phase === 'FREV') && p.last && S.q) {
    rk = 'r' + S.q.k;
    if (S.phase === 'FREV' && !p.alive) anim = 'cair';
    else if (p.last.ok) anim = S.style === 'vf' ? 'feliz' : (p.last.first || p.streak >= 3 ? 'cambalhota' : (Math.random() < .5 ? 'saltar' : 'dancar'));
    else if (p.last.ok === false) anim = 'errou';
    else anim = 'abanar';
  } else if (S.phase === 'END') {
    rk = 'end';
    anim = p.id === S.winner ? 'dancar' : null;
  } else if (S.phase === 'LOBBY') {
    rk = 'lobby'; anim = 'saltar';
  } else if (S.phase === 'INTRO') {
    rk = 'intro' + S.round; anim = Math.random() < .5 ? 'virar' : null;
  }
  if (rk && holder.rk !== rk) {
    holder.rk = rk;
    if (anim) {
      if (S.phase === 'END' && p.id === S.winner) a.play('dancar', true);
      else { a.loopAnim = null; a.play(anim); }
    } else if (S.phase === 'END') { a.loopAnim = null; }
  }
  if (S.phase !== 'END' && a.loopAnim) a.loopAnim = null;
}
function showDelta(card, txt, pos) {
  const d = document.createElement('div');
  d.className = 'delta ' + (pos ? 'pos' : 'neg');
  d.textContent = txt;
  card.appendChild(d);
  setTimeout(() => d.remove(), 2300);
}

/* ---------- tira de jogadores (TV e mini) ---------- */
function syncCards(el, S, kind) {
  const map = G.cards[kind] || (G.cards[kind] = {});
  const ids = S.order;
  for (const pid in map) {
    if (!ids.includes(pid) || !map[pid].root.isConnected) { map[pid].actor.destroy(); map[pid].root.remove(); delete map[pid]; }
  }
  const lobby = S.phase === 'LOBBY';
  ids.forEach((pid, idx) => {
    const p = S.players[pid];
    let c = map[pid];
    if (!c) {
      const root = document.createElement('div');
      root.className = kind === 'tv' ? 'glass pcard' : 'm';
      root.innerHTML = '<div class="act"></div><div class="nm"></div><div class="sc"></div><div class="st"></div>' + (kind === 'tv' ? '<div class="tbarp hidden"><i></i></div>' : '');
      el.appendChild(root);
      c = { root, actEl: root.querySelector('.act'), nm: root.querySelector('.nm'), sc: root.querySelector('.sc'), st: root.querySelector('.st'), bar: root.querySelector('.tbarp') };
      c.actor = mountActor(c.actEl, kind === 'tv' ? 5 : 2, p.anim, p.acc);
      regActor(pid, c.actor);
      map[pid] = c;
    }
    if (el.children[idx] !== c.root) el.insertBefore(c.root, el.children[idx] || null);
    c.nm.textContent = p.name + (pid === G.me && kind !== 'tv' ? L(' (tu)', ' (you)') : '');
    const fin = S.fin && ['FINTRO', 'FQ', 'FREV', 'END'].includes(S.phase);
    c.sc.textContent = fin && S.phase !== 'END' ? p.time + 's' : p.score;
    if (c.bar) {
      c.bar.classList.toggle('hidden', !fin || S.phase === 'END');
      if (fin) { const i = c.bar.firstChild; i.style.width = Math.min(100, p.time / FINAL_MAX * 100) + '%'; i.classList.toggle('low', p.time <= 10); }
    }
    let st = '';
    if (!p.on) st = '📵';
    else if (S.fin && !p.alive) st = '💀';
    else if (S.phase === 'VOTE' && p.voted) st = '🗳️';
    else if (S.phase === 'ATTACK' && p.atk) st = '😈';
    else if (S.phase === 'BET' && p.bet != null) st = '💰';
    else if (S.phase === 'Q' && p.hit && !p.hit.cleared) st = p.hit.w === 'ink' ? '🖤' : '🥧';
    else if ((S.phase === 'Q' || S.phase === 'FQ') && p.ans) st = '✅';
    else if (S.phase === 'END' && pid === S.winner) st = '👑';
    c.st.textContent = st;
    c.root.classList.toggle('off', !p.on);
    c.root.classList.toggle('done', !!st && st !== '📵' && st !== '💀');
    // expulsar (só no lobby, no ecrã do anfitrião)
    let k = c.root.querySelector('.kick');
    if (lobby && G.host && kind === 'tv' && pid !== G.me) {
      if (!k) { k = document.createElement('button'); k.className = 'kick'; k.textContent = '×'; k.title = L('Remover', 'Remove'); k.onclick = () => UI.hostAct('kick', { pid }); c.root.appendChild(k); }
    } else if (k) k.remove();
    // pontos ganhos/perdidos
    if ((S.phase === 'REVEAL' || S.phase === 'FREV') && p.last && S.q && c.dk !== S.q.k) {
      c.dk = S.q.k;
      if (S.phase === 'FREV') { if (p.last.dt) showDelta(c.root, p.last.dt + 's', false); }
      else if (p.last.pts) showDelta(c.root, (p.last.pts > 0 ? '+' : '') + p.last.pts, p.last.pts > 0);
    }
    syncActor(c, S, p);
  });
}

/* ---------- bloco da pergunta (TV e palco do telemóvel) ---------- */
function qKeyOf(S) { return S.q ? S.q.k : ''; }
function buildQ(el, S, compact) {
  const q = S.q;
  const meta = S.phase === 'FQ' || S.phase === 'FREV' ? L('Pergunta ', 'Question ') + q.n + ' · ' + esc(q.cat) : L('Pergunta ', 'Question ') + q.n + L(' de ', ' of ') + q.of + ' · ' + esc(q.cat);
  let h = `<div class="qwrap ${compact ? '' : 'fade'}"><div class="${compact ? '' : 'glass '}qbox">${compact ? '' : '<div class="tbar"><i></i></div>'}<div class="qmeta">${meta}</div>`;
  if (q.kind === 'emo') h += `<div class="qemo">${esc(q.emo)}</div>`;
  h += `<div class="qtext">${esc(q.text)}</div>`;
  if (q.kind === 'pis') h += `<div class="clues">${[0, 1, 2].map(i => `<div class="clue wait" data-c="${i}"><i>${L('PISTA', 'CLUE')} ${i + 1}</i><span></span></div>`).join('')}</div>`;
  h += '</div>';
  if (!compact) {
    const vf = q.kind === 'vf';
    h += `<div class="answers ${vf ? 'two' : ''}">` + q.ans.map((a, i) => `<div class="ans ${vf ? (i ? 'cf' : 'cv') : 'c' + i}" data-i="${i}"><span class="sh">${vf ? (i ? '✖' : '✔') : SHAPES[i]}</span><span class="tx"></span><div class="who"></div></div>`).join('') + '</div>';
  }
  h += '</div>';
  el.innerHTML = h;
}
function updQ(el, S) {
  const q = S.q;
  if (!q) return;
  const bar = el.querySelector('.tbar i');
  if (bar) bar.style.width = (S.tMax ? Math.max(0, S.t / S.tMax) * 100 : 0) + '%';
  if (q.kind === 'pis') {
    el.querySelectorAll('.clue').forEach(c => {
      const i = +c.dataset.c, has = q.clues && q.clues[i] != null;
      c.classList.toggle('wait', !has);
      c.querySelector('span').textContent = has ? q.clues[i] : '…';
    });
  }
  const rev = q.correct != null;
  el.querySelectorAll('.ans').forEach(a => {
    const i = +a.dataset.i, tx = a.querySelector('.tx');
    if (tx.textContent !== q.ans[i]) tx.textContent = q.ans[i];
    tx.classList.toggle('masked', !!q.masked);
    a.classList.toggle('right', rev && i === q.correct);
    a.classList.toggle('dim', rev && i !== q.correct);
    const who = a.querySelector('.who');
    const wk = rev ? 'w' + q.k : '';
    if (who.dataset.k !== wk) {
      who.dataset.k = wk; who.innerHTML = '';
      if (rev && q.picks) for (const pid in q.picks) if (q.picks[pid] === i && S.players[pid]) {
        const p = S.players[pid];
        who.appendChild(staticAv(p.anim, p.acc, i === q.correct ? 'feliz' : 'triste', 40, 48));
      }
    }
  });
}

/* =========================================================
   ECRÃ PRINCIPAL (TV)
   ========================================================= */
function topLeft(S) {
  if (S.phase === 'LOBBY') return L('Sala', 'Room') + ' <b class="pix">' + esc(S.code) + '</b>';
  if (S.fin) return '<b>🔥 ' + L('Grande Final', 'Grand Final') + '</b>';
  if (S.style && STYLE_DEF[S.style]) return L('Ronda', 'Round') + ' <b>' + S.round + '/' + S.nRounds + '</b> · ' + STYLE_DEF[S.style].ic + ' ' + styleName(S.style);
  return '';
}

function renderTV(S, P) {
  $('tv-l').innerHTML = topLeft(S);
  $('tv-c').textContent = S.phase === 'Q' || S.phase === 'REVEAL' ? (S.phase === 'REVEAL' ? L('Resposta certa…', 'The answer is…') : S.cat || '') : (PHASE_TITLE()[S.phase] || '');
  const tEl = $('tv-t');
  const timed = !['LOBBY', 'END'].includes(S.phase);
  tEl.textContent = timed ? S.t : '';
  tEl.classList.toggle('low', (S.phase === 'Q' || S.phase === 'FQ') && S.t <= 3);
  $('tv-skip').classList.toggle('hidden', !G.host || !['INTRO', 'VOTE', 'THEME', 'ATTACK', 'BET', 'RANK', 'FINTRO', 'REVEAL'].includes(S.phase));
  const main = $('tv-main');
  const v = TVV[S.phase] || TVV.LOBBY;
  const key = S.phase + '|' + v.key(S);
  patch(main, key, el => v.build(el, S));
  if (v.upd) v.upd(main, S);
  syncCards($('tv-strip'), S, 'tv');
}

function updOpts(S) {
  const sa = $('seg-aud'), sl = $('seg-len'), bs = $('btn-start'), sg = $('seg-lang');
  if (!sa) return;
  const k = S.aud + S.len + S.lang + S.order.length + (G.host ? 1 : 0);
  if (sa.dataset.k === k) return;
  sa.dataset.k = k;
  if (sg) sg.innerHTML = Object.entries(LANG_LBL).map(([id, [n]]) => `<button class="${S.lang === id ? 'on' : ''}" ${G.host ? '' : 'disabled'} onclick="UI.hostAct('opts',{lang:'${id}'})">${n}</button>`).join('');
  sa.innerHTML = Object.entries(AUD_LBL()).map(([id, [n, s]]) => `<button class="${S.aud === id ? 'on' : ''}" ${G.host ? '' : 'disabled'} onclick="UI.hostAct('opts',{aud:'${id}'})">${n}<small>${s}</small></button>`).join('');
  sl.innerHTML = Object.entries(LEN_LBL()).map(([id, [n, s]]) => `<button class="${S.len === +id ? 'on' : ''}" ${G.host ? '' : 'disabled'} onclick="UI.hostAct('opts',{len:${id}})">${n}<small>${s}</small></button>`).join('');
  if (bs) {
    const n = S.order.length;
    bs.disabled = !n || !G.host;
    bs.textContent = !G.host ? L('O anfitrião vai começar…', 'The host will start…') : n ? L('▶ Começar (', '▶ Start (') + n + (n === 1 ? L(' jogador', ' player') : L(' jogadores', ' players')) + ')' : L('À espera de jogadores…', 'Waiting for players…');
  }
}

UI.toggleSound = () => { G.sound = !G.sound; $('tv-snd').textContent = G.sound ? '🔊' : '🔇'; $('tv-snd').classList.toggle('off', !G.sound); SFX.unlock(); };

let meHolder = null;
function renderPh(S, P) {
  const me = S.players[G.me];
  if (!me) {
    if (S.phase !== 'LOBBY') return;
    showView('v-home'); toast(L('Já não estás nesta sala.', 'You are no longer in this room.')); clearSess(); return;
  }
  // barra de cima
  $('ph-l').innerHTML = S.phase === 'LOBBY' ? L('Sala', 'Room') + '<b class="pix">' + esc(S.code) + '</b>' : S.fin ? L('Grande<b>Final 🔥</b>', 'Grand<b>Final 🔥</b>') : (S.style && STYLE_DEF[S.style] ? L('Ronda ', 'Round ') + S.round + '/' + S.nRounds + '<b>' + STYLE_DEF[S.style].ic + ' ' + esc(styleName(S.style)) + '</b>' : '');
  const timed = !['LOBBY', 'END'].includes(S.phase);
  $('ph-t').textContent = timed ? S.t : '';
  $('ph-t').classList.toggle('low', (S.phase === 'Q' || S.phase === 'FQ') && S.t <= 3);
  const finNow = S.fin && ['FINTRO', 'FQ', 'FREV'].includes(S.phase);
  $('ph-r').innerHTML = finNow ? `<span class="pix">${me.time}s</span><small>${L('tempo', 'time')}</small>` : `<span class="pix">${me.score}</span><small>${L('pontos', 'points')}</small>`;

  // o meu boneco
  const actEl = $('ph-act');
  if (!meHolder || !meHolder.actor.cv.isConnected || meHolder.pid !== G.me) {
    actEl.innerHTML = '';
    meHolder = { pid: G.me, actor: mountActor(actEl, 4, me.anim, me.acc) };
    regActor(G.me, meHolder.actor);
  }
  syncActor(meHolder, S, me);
  $('ph-bubble').innerHTML = bubbleText(S, me);
  document.querySelector('.ph').classList.toggle('compact', ['Q', 'FQ', 'ATTACK', 'LOBBY', 'RANK', 'END'].includes(S.phase));

  // palco (modo mesa: todos veem tudo)
  const mesa = S.mode === 'mesa';
  const stage = $('ph-stage');
  const showQ = S.q && ['Q', 'REVEAL', 'FQ', 'FREV'].includes(S.phase);
  stage.classList.toggle('hidden', !mesa || S.phase === 'LOBBY');
  if (mesa && S.phase !== 'LOBBY') {
    const qEl = $('ph-q');
    patch(qEl, showQ ? 'q' + S.q.k : 'none', el => { if (showQ) buildQ(el, S, true); });
    if (showQ) updQ(qEl, S);
    syncCards($('ph-mini'), S, 'mini');
  }

  // controlos
  const ctrl = $('ph-ctrl');
  const v = PHV[S.phase] || PHV.LOBBY;
  patch(ctrl, S.phase + '|' + v.key(S, me), el => v.build(el, S, me));
  if (v.upd) v.upd(ctrl, S, me);

  // ataques no meu ecrã
  if (S.phase === 'Q' && me.hit && !me.hit.cleared) {
    const hk = me.hit.k + me.hit.w;
    if (G.hitKey !== hk) { G.hitKey = hk; if (me.hit.w === 'ink') OVL.ink(me.hit.from); else OVL.pie(me.hit.from); vib([200, 80, 200]); }
  } else if (S.phase !== 'Q') OVL.close();

  // vibração no resultado
  if ((S.phase === 'REVEAL' || S.phase === 'FREV') && P && P.phase !== S.phase && me.last) vib(me.last.ok ? 40 : [60, 50, 60]);
}

function bubbleText(S, me) {
  const n = esc(me.name);
  const l = me.last;
  switch (S.phase) {
    case 'LOBBY': return `<b>${n}</b>` + L('Toca em mim! 😄', 'Tap me! 😄');
    case 'INTRO': return L('<b>Nova ronda!</b>Lê as regras ali em cima.', '<b>New round!</b>Read the rules above.');
    case 'VOTE': return me.voted ? L('<b>Votado!</b>Espera pelos outros…', '<b>Voted!</b>Waiting for the others…') : L('<b>Vota no tema</b>Qual te dá mais jeito?', '<b>Vote for a topic</b>Which one suits you?');
    case 'THEME': return '<b>' + L('Tema: ', 'Topic: ') + esc(S.cat) + '</b>' + L('Prepara o cérebro!', 'Warm up your brain!');
    case 'ATTACK': return me.atk ? L('<b>Hehehe… 😈</b>Agora é esperar.', '<b>Hehehe… 😈</b>Now we wait.') : L('<b>Sabotagem!</b>Escolhe uma vítima…', '<b>Sabotage!</b>Pick a victim…');
    case 'BET': return me.bet != null ? L('<b>Aposta feita!</b>Que nervos…', '<b>Bet placed!</b>So nervous…') : L('<b>Quanto arriscas?</b>', '<b>How much will you risk?</b>');
    case 'READY': return L('<b>Atenção…</b>Dedo pronto!', '<b>Heads up…</b>Finger ready!');
    case 'Q': return me.ans ? L('<b>Resposta enviada!</b>Será que acertei?', '<b>Answer sent!</b>Did I get it right?') : L('<b>Hmm…</b>Escolhe depressa!', '<b>Hmm…</b>Pick quickly!');
    case 'REVEAL':
      if (!l || l.ok == null) return L('<b>Ups!</b>Não respondi a tempo…', '<b>Oops!</b>I was too slow…');
      return l.ok ? `<b>${L('Boa!!', 'Yes!!')} ${l.pts ? '+' + l.pts : ''}</b>${l.first ? L('Fui o primeiro! 🎯', 'I was first! 🎯') : L('Sou um génio!', "I'm a genius!")}` : `<b>${L('Ai…', 'Ouch…')}</b>${l.pts < 0 ? L('Perdi ' + (-l.pts) + ' pontos.', 'I lost ' + (-l.pts) + ' points.') : L('Errei esta.', 'Got that one wrong.')}`;
    case 'RANK': return L('<b>Classificação</b>Como estou?', '<b>Standings</b>How am I doing?');
    case 'FINTRO': return L(`<b>Tenho ${me.time} segundos!</b>Vou sobreviver!`, `<b>I have ${me.time} seconds!</b>I will survive!`);
    case 'FQ': return !me.alive ? L('<b>Fui eliminado 💀</b>Agora só vejo…', "<b>I'm out 💀</b>Just watching now…") : me.time <= 10 ? L('<b>AAAH!</b>Estou quase sem tempo!', "<b>AAAH!</b>I'm almost out of time!") : me.ans ? L('<b>Feito!</b>Que venha a próxima.', '<b>Done!</b>Bring on the next one.') : L('<b>Rápido!</b>O tempo está a fugir!', '<b>Quick!</b>Time is running out!');
    case 'FREV': return !me.alive ? L('<b>Eliminado…</b>Foi bonito enquanto durou.', '<b>Eliminated…</b>It was fun while it lasted.') : !l ? '' : l.ok ? L('<b>Certo!</b>Continuo vivo!', "<b>Correct!</b>Still alive!") : l.ok === false ? L('<b>-10 segundos!</b>Ai ai ai…', '<b>-10 seconds!</b>Ouch ouch…') : L('<b>-5 segundos!</b>Fui lento…', '<b>-5 seconds!</b>Too slow…');
    case 'END': return S.winner === me.id ? L('<b>GANHEI!! 🏆</b>Sou o maior!', "<b>I WON!! 🏆</b>I'm the best!") : L('<b>Fim de jogo</b>Para a próxima é que é!', '<b>Game over</b>Next time for sure!');
  }
  return '';
}
UI.meTrick = () => { if (meHolder) meHolder.actor.play(TRICKS[Math.floor(Math.random() * TRICKS.length)]); };

function msgBig(ic, title, sub, extra) { return `<div class="msg-big pop"><div class="ic">${ic}</div><h2>${title}</h2>${sub ? '<p>' + sub + '</p>' : ''}${extra || ''}</div>`; }

function answerGrid(el, S, me, enabled) {
  const q = S.q, vf = q.kind === 'vf';
  const mine = G.myAns && G.myAns.k === q.k ? G.myAns.i : null;
  const locked = mine != null || me.ans || !enabled;
  const rev = q.correct != null;
  el.innerHTML = `<div class="answers ${vf ? 'two' : ''} ${locked ? 'locked' : ''}">` + q.ans.map((a, i) => {
    const cls = vf ? (i ? 'cf' : 'cv') : 'c' + i;
    return `<button class="ans ${cls} ${mine === i ? 'sel' : ''} ${rev ? (i === q.correct ? 'right' : 'dim') : ''}" data-i="${i}"><span class="sh">${vf ? (i ? '✖' : '✔') : SHAPES[i]}</span><span class="tx ${q.masked ? 'masked' : ''}" style="${a.length > 22 ? 'font-size:15px' : ''}">${esc(a)}</span></button>`;
  }).join('') + '</div>';
  if (!locked) el.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    G.myAns = { k: q.k, i };
    send({ t: 'R', i, k: q.k });
    vib(25);
    b.classList.add('sel');
    b.parentNode.classList.add('locked');
    b.parentNode.querySelectorAll('.ans').forEach(x => (x.onclick = null));
  });
}

        h += `<div class="glass" style="padding:12px;margin-top:6px"><div class="lbl" style="margin-top:0">${L('Jogadores', 'Players')} (${others.length}/6)</div><div class="plist">${others.map(p => `<div class="pi">${avHTML(p, 46, 60)}<div>${esc(p.name)}</div></div>`).join('')}</div>
          <p class="muted small center mt">${L('Público', 'Audience')}: <b>${AUD_LBL()[S.aud][0]}</b> · ${L('Duração', 'Length')}: <b>${LEN_LBL()[S.len][0]}</b></p></div>`;

  INTRO: {
    key: S => S.round,
    build(el, S) { const d = STYLE_DEF[S.style]; el.innerHTML = msgBig(d.ic, L('Ronda ', 'Round ') + S.round + ': ' + esc(styleName(S.style)), esc(styleDesc(S.style)), `<p class="muted mt">${S.nq} ${S.style === 'vf' ? L('afirmações', 'statements') : L('perguntas', 'questions')}</p>`); }
  },
  VOTE: {
    key: (S, me) => S.round + '|' + me.voted + '|' + (G.myVote && G.myVote.r === S.round ? G.myVote.i : ''),
    build(el, S, me) {
      const mine = G.myVote && G.myVote.r === S.round ? G.myVote.i : null;
      el.innerHTML = `<h2 class="center" style="font-weight:900;font-size:22px">${me.voted ? L('Voto registado! ✅', 'Vote counted! ✅') : L('Vota no próximo tema', 'Vote for the next topic')}</h2>` +
        S.vote.opts.map((o, i) => `<button class="choice ${mine === i ? 'on' : ''}" data-i="${i}" ${me.voted ? 'disabled' : ''}><span class="ic">${['🅰️', '🅱️', '🆎'][i] || '•'}</span><span>${esc(o)}</span></button>`).join('');
      if (!me.voted) el.querySelectorAll('.choice').forEach(b => b.onclick = () => { G.myVote = { r: S.round, i: +b.dataset.i }; send({ t: 'V', i: +b.dataset.i }); vib(25); G.keys['ph-ctrl'] = null; renderPh(G.S); });
    }
  },
  THEME: { key: S => S.round, build(el, S) { el.innerHTML = msgBig('🎯', esc(S.cat), L('Este é o tema da ronda!', "This round's topic!")); } },
  ATTACK: {
    key: (S, me) => S.round + '|' + me.atk + '|' + JSON.stringify(G.atkUI && G.atkUI.r === S.round ? G.atkUI : {}),
    build(el, S, me) {
      if (!G.atkUI || G.atkUI.r !== S.round) G.atkUI = { r: S.round, w: null };
      const ui = G.atkUI;
      const targets = S.order.map(id => S.players[id]).filter(p => p.id !== G.me);
      if (me.atk) { el.innerHTML = ui.sent === 'none' ? msgBig('😇', L('Hoje estás pacífico', 'Feeling peaceful today'), L('Não atacaste ninguém.', "You didn't attack anyone.")) : msgBig('😈', L('Ataque preparado!', 'Attack ready!'), ui.sent === 'roubo' ? L('Os pontos já são teus!', 'The points are yours!') : L('Vai cair numa pergunta surpresa…', 'It will land on a surprise question…')); return; }
      const WP = WEAPONS();
      if (!ui.w) {
        el.innerHTML = `<h2 class="center" style="font-weight:900;font-size:22px">😈 ${L('Escolhe a arma', 'Pick a weapon')}</h2>` +
          Object.entries(WP).map(([id, w]) => `<button class="choice" data-w="${id}"><span class="ic">${w.ic}</span><span>${w.nome}<small>${w.desc}</small></span></button>`).join('') +
          `<button class="btn btn-ghost btn-sm" style="align-self:center" id="atk-skip">${L('Não atacar ninguém', "Don't attack anyone")}</button>`;
        el.querySelectorAll('.choice').forEach(b => b.onclick = () => { ui.w = b.dataset.w; G.keys['ph-ctrl'] = null; renderPh(G.S); });
      } else {
        const w = WP[ui.w];
        el.innerHTML = `<h2 class="center" style="font-weight:900;font-size:20px">${w.ic} ${w.nome}: ${L('em quem?', 'on whom?')}</h2>` +
          targets.map(p => `<button class="choice" data-p="${p.id}" ${p.on ? '' : 'disabled'}>${avHTML(p, 40, 52)}<span>${esc(p.name)}<small>${p.score} ${L('pontos', 'points')}${p.on ? '' : L(' · desligado', ' · offline')}</small></span></button>`).join('') +
          `<div class="row" style="justify-content:center"><button class="btn btn-ghost btn-sm" id="atk-back">← ${L('Outra arma', 'Other weapon')}</button><button class="btn btn-ghost btn-sm" id="atk-skip">${L('Não atacar', "Don't attack")}</button></div>`;
        hydrateAv(el);
        el.querySelectorAll('.choice').forEach(b => b.onclick = () => { ui.sent = ui.w; send({ t: 'A', w: ui.w, to: b.dataset.p }); vib(40); });
        $('atk-back').onclick = () => { ui.w = null; G.keys['ph-ctrl'] = null; renderPh(G.S); };
      }
      $('atk-skip').onclick = () => { ui.sent = 'none'; send({ t: 'A' }); };
    }
  },
  BET: {
    key: (S, me) => qKeyOf(S) + '|' + me.bet,
    build(el, S, me) {
      if (me.bet != null) { el.innerHTML = msgBig('💰', L('Apostaste ', 'You bet ') + me.bet, L('Se acertares ganhas ' + me.bet + '. Se errares, perdes ' + Math.min(me.bet, me.score) + '.', 'Right: you win ' + me.bet + '. Wrong: you lose ' + Math.min(me.bet, me.score) + '.')); return; }
      el.innerHTML = `<h2 class="center" style="font-weight:900;font-size:22px">${L('Quanto apostas?', 'How much will you bet?')}</h2><p class="center muted small">${L('Tema', 'Topic')}: <b>${esc(S.cat)}</b> · ${L('tens', 'you have')} ${me.score} ${L('pontos', 'points')}</p><div class="betgrid">${BET_OPTS.map(v => `<button class="btn ${v >= 1000 ? 'btn-red' : v >= 500 ? 'btn-gold' : v >= 250 ? 'btn-purple' : 'btn-blue'}" data-v="${v}">${v}</button>`).join('')}</div><p class="center muted small">${L('Se não apostares, conta como 100.', "If you don't bet, it counts as 100.")}</p>`;
      el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { send({ t: 'B', v: +b.dataset.v }); vib(25); });
    }
  },
  READY: { key: S => qKeyOf(S), build(el, S) { el.innerHTML = msgBig(STYLE_DEF[S.style].ic, L('Pergunta ', 'Question ') + S.q.n + L(' de ', ' of ') + S.q.of, S.mode === 'tv' ? L('Olha para o ecrã principal!', 'Look at the main screen!') : L('Prepara-te!', 'Get ready!')); } },
  Q: {
    key: (S, me) => qKeyOf(S) + '|' + (me.ans || (G.myAns && G.myAns.k === S.q.k) ? 'a' : '') + '|' + (S.q.masked ? S.q.ans.join('~') : ''),
    build(el, S, me) {
      if (!me.on) { el.innerHTML = msgBig('📵', L('Desligado', 'Offline'), ''); return; }
      answerGrid(el, S, me, true);
    }
  },
  REVEAL: {
    key: S => qKeyOf(S),
    build(el, S, me) {
      const l = me.last, q = S.q;
      const right = q.ans[q.correct];
      if (!l || l.ok == null) el.innerHTML = msgBig('⏰', L('Não respondeste!', "You didn't answer!"), L('A resposta certa era: ', 'The right answer was: ') + '<b>' + esc(right) + '</b>', S.style === 'aposta' && l && l.pts ? `<div class="pts" style="color:#f87171">${l.pts}</div>` : '');
      else if (l.ok) el.innerHTML = msgBig(l.first ? '🎯' : '✅', L('Certo!', 'Correct!'), esc(right), `<div class="pts" style="color:#4ade80">+${l.pts}</div>`);
      else el.innerHTML = msgBig('❌', L('Errado…', 'Wrong…'), L('A resposta certa era: ', 'The right answer was: ') + '<b>' + esc(right) + '</b>', l.pts ? `<div class="pts" style="color:#f87171">${l.pts}</div>` : '');
    }
  },
  RANK: {
    key: S => S.round,
    build(el, S, me) {
      const r = ranked(S), pos = r.findIndex(p => p.id === me.id) + 1;
      el.innerHTML = msgBig(pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : '📊', L('Estás em ' + ordinal(pos) + ' lugar', "You're in " + ordinal(pos) + ' place'), L('Nesta ronda: ', 'This round: ') + (me.roundPts >= 0 ? '+' : '') + me.roundPts + L(' pontos', ' points')) +
        `<div class="rank" style="margin-top:6px">${r.map((p, i) => `<div class="rrow ${p.id === me.id ? 'first' : ''}" style="font-size:15px;padding:6px 10px"><span class="pos">${ordinal(i + 1)}</span>${avHTML(p, 30, 40)}<span class="nm">${esc(p.name)}</span><span class="pts">${p.score}</span></div>`).join('')}</div>`;
      hydrateAv(el);
    }
  },
  FINTRO: {
    key: () => 'f',
    build(el, S, me) {
      el.innerHTML = msgBig('🔥', L('Grande Final!', 'Grand Final!'), L('Os teus pontos viraram tempo. Responde certo para não perderes segundos. Não responder: −5 s. Errar: −10 s.', 'Your points became time. Answer right to keep your seconds. No answer: −5 s. Wrong: −10 s.'), `<div class="bigtime mt">${me.time}s</div>`);
    }
  },
  FQ: {
    key: (S, me) => qKeyOf(S) + '|' + me.alive + '|' + (me.ans || (G.myAns && G.myAns.k === S.q.k) ? 'a' : ''),
    build(el, S, me) {
      if (!me.alive) { el.innerHTML = msgBig('💀', L('Eliminado', 'Eliminated'), L('Assiste ao resto da final!', 'Watch the rest of the final!')); return; }
      el.innerHTML = `<div class="bigtime" id="ph-big"></div><div style="flex:1;min-height:0" id="ph-ans"></div>`;
      answerGrid($('ph-ans'), S, me, true);
    },
    upd(el, S, me) { const b = $('ph-big'); if (b) { b.textContent = me.time + 's'; b.classList.toggle('low', me.time <= 10); } }
  },
  FREV: {
    key: S => qKeyOf(S),
    build(el, S, me) {
      const l = me.last, right = S.q.ans[S.q.correct];
      const era = L('Era: ', 'It was: ');
      if (!me.alive && (!l || l.dt)) el.innerHTML = msgBig('💀', L('Ficaste sem tempo!', 'You ran out of time!'), L('A resposta certa era: ', 'The right answer was: ') + '<b>' + esc(right) + '</b>');
      else if (!me.alive) el.innerHTML = msgBig('💀', L('Eliminado', 'Eliminated'), L('Assiste ao resto da final!', 'Watch the rest of the final!'));
      else if (!l || l.ok == null) el.innerHTML = msgBig('⏰', L('−5 segundos', '−5 seconds'), era + '<b>' + esc(right) + '</b>', `<div class="bigtime">${me.time}s</div>`);
      else if (l.ok) el.innerHTML = msgBig('✅', L('Certo!', 'Correct!'), esc(right), `<div class="bigtime">${me.time}s</div>`);
      else el.innerHTML = msgBig('❌', L('−10 segundos', '−10 seconds'), era + '<b>' + esc(right) + '</b>', `<div class="bigtime low">${me.time}s</div>`);
    }
  },
  END: {
    key: S => S.winner,
    build(el, S, me) {
      const pos = (S.rank || []).indexOf(me.id) + 1;
      const w = S.players[S.winner];
      el.innerHTML = (S.winner === me.id ? msgBig('🏆', S.fin && S.fin.solo ? L('Sobreviveste!', 'You survived!') : L('GANHASTE!', 'YOU WON!'), S.fin && S.fin.solo ? L('Aguentaste ' + S.fin.n + ' perguntas.', 'You lasted ' + S.fin.n + ' questions.') : L('És o grande sobrevivente!', "You're the last survivor!")) : msgBig(pos === 2 ? '🥈' : pos === 3 ? '🥉' : '🎮', L('Ficaste em ' + ordinal(pos), 'You finished ' + ordinal(pos)), L('Venceu ', 'Winner: ') + esc(w ? w.name : '') + '!')) +
        `<div class="rank" style="margin-top:6px">${(S.rank || []).map(id => S.players[id]).filter(Boolean).map((p, i) => `<div class="rrow ${i === 0 ? 'first' : ''}" style="font-size:15px;padding:6px 10px"><span class="pos">${ordinal(i + 1)}</span>${avHTML(p, 30, 40)}<span class="nm">${esc(p.name)}</span><span class="pts">${p.score}</span></div>`).join('')}</div>` +
        (G.host ? '<div class="row mt"><button class="btn btn-gold" onclick="UI.hostAct(\'again\')">🔁 ' + L('Outra vez', 'Again') + '</button><button class="btn btn-ghost" onclick="UI.newGame()">' + L('Novo', 'New') + '</button></div>' : '');
      hydrateAv(el);
    }
  }
};

UI.share = async () => {
  const url = joinUrl(G.code);
  const text = L('Entra no meu jogo Saber & Sobreviver! Código: ', 'Join my Know & Survive game! Code: ') + G.code;
  try {
    if (navigator.share) { await navigator.share({ title: L('Saber & Sobreviver', 'Know & Survive'), text, url }); return; }
    await navigator.clipboard.writeText(url);
    toast(L('Link copiado! Envia aos outros jogadores.', 'Link copied! Send it to the other players.'), true);
  } catch (e) { toast(L('Código da sala: ', 'Room code: ') + G.code, true); }
};

/* =========================================================
   TINTA E TARTE (no ecrã de quem é atacado)
   ========================================================= */
const OVL = {
  cur: null,
  sizeCv(cv) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(window.innerWidth * dpr); cv.height = Math.round(window.innerHeight * dpr);
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    return g;
  },
  close() {
    if (!this.cur) return;
    $('ovl-ink').classList.add('hidden'); $('ovl-pie').classList.add('hidden');
    this.cur = null;
  },
  done() { this.close(); send({ t: 'C' }); vib(30); },
  ink(from) {
    this.close();
    const o = $('ovl-ink'), cv = $('ink-cv');
    o.classList.remove('hidden');
    const g = this.sizeCv(cv), W = window.innerWidth, H = window.innerHeight;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#050509'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 14; i++) { // manchas mais escuras e brilhantes da tinta
      const x = Math.random() * W, y = Math.random() * H, r = 30 + Math.random() * 90;
      const gr = g.createRadialGradient(x - r * .3, y - r * .3, 2, x, y, r);
      gr.addColorStop(0, 'rgba(70,80,120,.22)'); gr.addColorStop(1, 'rgba(5,5,9,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    g.fillStyle = 'rgba(180,190,255,.10)';
    for (let i = 0; i < 18; i++) { g.beginPath(); g.ellipse(Math.random() * W, Math.random() * H, 3 + Math.random() * 10, 2 + Math.random() * 5, Math.random() * 3, 0, 7); g.fill(); }
    let taps = 0; const need = 10;
    $('ink-msg').textContent = (from ? from + L(' acertou-te! ', ' got you! ') : '') + L('Toca ' + need + ' vezes para limpar!', 'Tap ' + need + ' times to clean it!');
    this.cur = 'ink';
    cv.onpointerdown = e => {
      e.preventDefault();
      taps++;
      g.globalCompositeOperation = 'destination-out';
      const x = e.clientX, y = e.clientY, r = Math.max(W, H) * .09;
      for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(x + (Math.random() - .5) * r * 1.6, y + (Math.random() - .5) * r * 1.6, r * (.35 + Math.random() * .6), 0, 7); g.fill(); }
      vib(15);
      const left = need - taps;
      $('ink-msg').textContent = left > 0 ? L('Mais ' + left + (left === 1 ? ' toque!' : ' toques!'), left + (left === 1 ? ' more tap!' : ' more taps!')) : L('Limpo!', 'Clean!');
      if (left <= 0) this.done();
    };
  },
  pie(from) {
    this.close();
    const o = $('ovl-pie'), cv = $('pie-cv');
    o.classList.remove('hidden');
    const g = this.sizeCv(cv), W = window.innerWidth, H = window.innerHeight;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#FFF1D2'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 40; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(255,255,255,.7)' : 'rgba(246,214,160,.6)'; g.beginPath(); g.arc(Math.random() * W, Math.random() * H, 20 + Math.random() * 60, 0, 7); g.fill(); }
    const cols = ['#F48FB1', '#7DD3FC', '#FDE047', '#86EFAC', '#C4B5FD'];
    for (let i = 0; i < 90; i++) { g.save(); g.translate(Math.random() * W, Math.random() * H); g.rotate(Math.random() * 3); g.fillStyle = cols[i % cols.length]; g.fillRect(-6, -2, 12, 4); g.restore(); }
    g.fillStyle = '#D7263D'; g.beginPath(); g.arc(W * .5, H * .42, 22, 0, 7); g.fill();
    g.strokeStyle = '#2F7D32'; g.lineWidth = 4; g.beginPath(); g.moveTo(W * .5, H * .42 - 20); g.quadraticCurveTo(W * .5 + 10, H * .42 - 50, W * .5 + 26, H * .42 - 56); g.stroke();
    const GX = 8, GY = 12, cells = new Set();
    $('pie-msg').textContent = (from ? from + L(' acertou-te! ', ' got you! ') : '') + L('Passa o dedo para limpar!', 'Swipe to wipe it off!');
    this.cur = 'pie';
    let down = false;
    const wipe = e => {
      if (!down) return;
      e.preventDefault();
      g.globalCompositeOperation = 'destination-out';
      const x = e.clientX, y = e.clientY, r = Math.max(32, Math.min(W, H) * .1);
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const cx = Math.floor((x + dx * r * .6) / W * GX), cy = Math.floor((y + dy * r * .6) / H * GY);
        if (cx >= 0 && cy >= 0 && cx < GX && cy < GY) cells.add(cx + ',' + cy);
      }
      const pct = cells.size / (GX * GY);
      $('pie-msg').textContent = pct < .75 ? L('Continua a limpar… ', 'Keep wiping… ') + Math.round(pct / .75 * 100) + '%' : L('Limpo!', 'Clean!');
      if (pct >= .75) { down = false; this.done(); }
    };
    cv.onpointerdown = e => { down = true; wipe(e); };
    cv.onpointermove = wipe;
    cv.onpointerup = cv.onpointercancel = () => { down = false; };
  }
};

initHome();
