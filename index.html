<title>Saber &amp; Sobreviver</title>

<style>
:root {
  --bg1: #050816; --bg2: #0e1638; --bg3: #1b1442;
  --glass: rgba(255, 255, 255, .065); --glass2: rgba(255, 255, 255, .10);
  --line: rgba(255, 255, 255, .13); --line2: rgba(255, 255, 255, .22);
  --txt: #f1f5ff; --txt2: #aab4d6; --txt3: #6f7aa3;
  --acc: #5b8cff; --acc2: #8b5cf6; --gold: #fbbf24; --ok: #22c55e; --bad: #ef4444; --warn: #f59e0b;
  --r: 18px;
  --pix: 'Press Start 2P', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Nunito', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  color: var(--txt);
  background: radial-gradient(ellipse at 20% 0%, #1d2a6b 0%, transparent 55%),
              radial-gradient(ellipse at 90% 100%, #3a1d6b 0%, transparent 50%),
              linear-gradient(160deg, var(--bg1), var(--bg2) 60%, var(--bg3));
  background-attachment: fixed;
  overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
button { font-family: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, select { font-family: inherit; }
.hidden { display: none !important; }

/* ---------- NEVE ---------- */
#snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.flake { position: absolute; top: -10px; border-radius: 50%; background: #fff; opacity: .5; animation: fall linear infinite; }
@keyframes fall {
  0% { transform: translate3d(0, -5vh, 0); }
  100% { transform: translate3d(var(--dx, 20px), 105vh, 0); }
}

/* ---------- BASE ---------- */
#app { position: relative; z-index: 1; height: 100%; }
.view { position: absolute; inset: 0; display: flex; align-items: center; align-items: safe center; justify-content: center; padding: 16px; overflow-y: auto; }
.glass {
  background: var(--glass); border: 1px solid var(--line); border-radius: var(--r);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 20px 50px -20px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .06);
}
.card { padding: 24px; width: 100%; max-width: 440px; }
.logo { text-align: center; margin-bottom: 22px; }
.logo h1 { font-size: clamp(34px, 8vw, 56px); font-weight: 900; line-height: 1; letter-spacing: -1px;
  background: linear-gradient(90deg, #7fb0ff, #b48cff 60%, #ff9ad5); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo .sub { margin-top: 10px; font-family: var(--pix); font-size: 10px; color: var(--gold); letter-spacing: 2px; }
.logo-bonecos { display: flex; justify-content: center; gap: 4px; margin-bottom: 8px; height: 64px; }
.logo-bonecos canvas { width: 52px; height: 64px; image-rendering: pixelated; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 16px 18px; border-radius: 16px; font-weight: 900; font-size: 18px; letter-spacing: .3px;
  border: 1px solid rgba(255, 255, 255, .16); box-shadow: 0 10px 22px -10px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .25);
  transition: transform .12s, filter .12s, opacity .2s; position: relative;
}
.btn:active { transform: scale(.96); filter: brightness(.95); }
.btn:disabled { opacity: .45; }
.btn-blue { background: linear-gradient(135deg, #5b8cff, #3d5cf0); }
.btn-green { background: linear-gradient(135deg, #2bd47a, #11a35d); }
.btn-red { background: linear-gradient(135deg, #ff5c6c, #d9263b); }
.btn-gold { background: linear-gradient(135deg, #ffcf4a, #f59e0b); color: #3a2400; }
.btn-purple { background: linear-gradient(135deg, #a77bff, #6d3df0); }
.btn-ghost { background: var(--glass2); }
.btn-sm { padding: 10px 14px; font-size: 14px; border-radius: 12px; width: auto; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; }
.muted { color: var(--txt2); }
.small { font-size: 13px; }
.center { text-align: center; }
.mt { margin-top: 14px; }
.lbl { font-size: 12px; font-weight: 800; color: var(--txt2); letter-spacing: 1.2px; text-transform: uppercase; margin: 14px 0 8px; }
.pix { font-family: var(--pix); }

.inp {
  width: 100%; padding: 15px; border-radius: 14px; background: rgba(8, 12, 32, .65); border: 1px solid var(--line2);
  color: #fff; font-size: 20px; font-weight: 800; text-align: center; outline: none;
}
.inp:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(91, 140, 255, .25); }
.inp.code { font-family: var(--pix); font-size: 28px; letter-spacing: 10px; text-transform: uppercase; padding: 18px 10px; }

/* escolha de modo */
.mode-card { text-align: left; padding: 18px; border-radius: 18px; background: var(--glass2); border: 1px solid var(--line); display: flex; gap: 14px; align-items: center; width: 100%; }
.mode-card:active { transform: scale(.98); }
.mode-card .ic { font-size: 36px; }
.mode-card b { font-size: 18px; display: block; }
.mode-card span { font-size: 13px; color: var(--txt2); }

/* ---------- AVATAR ---------- */
.av-wrap { max-width: 460px; width: 100%; }
.av-preview { display: flex; justify-content: center; align-items: flex-end; height: 170px; border-radius: 18px; background: radial-gradient(circle at 50% 70%, rgba(91, 140, 255, .25), transparent 70%); margin-bottom: 6px; cursor: pointer; }
.av-preview canvas { width: 156px; height: 192px; image-rendering: pixelated; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pick {
  aspect-ratio: 1; border-radius: 14px; background: rgba(8, 12, 32, .55); border: 2px solid transparent;
  display: flex; align-items: center; justify-content: center; transition: all .15s; position: relative;
}
.pick canvas { width: 82%; height: 82%; image-rendering: pixelated; }
.pick .none { font-size: 11px; font-weight: 900; color: var(--txt3); }
.pick.sel { border-color: #6ea0ff; background: rgba(91, 140, 255, .22); box-shadow: 0 0 18px rgba(91, 140, 255, .55), inset 0 0 12px rgba(91, 140, 255, .3); transform: scale(1.06); }

/* ---------- TV ---------- */
#v-tv { padding: 0; align-items: stretch; justify-content: stretch; overflow: hidden; }
.tv { display: grid; grid-template-rows: auto 1fr auto; width: 100%; height: 100%; padding: 1.6vh 1.6vw; gap: 1.4vh; }
.tv-top { display: flex; align-items: center; justify-content: space-between; padding: 1.2vh 1.6vw; gap: 2vw; }
.tv-top .l { font-weight: 900; font-size: clamp(14px, 2vw, 26px); color: var(--txt2); white-space: nowrap; }
.tv-top .l b { color: #fff; }
.tv-top .c { font-weight: 900; font-size: clamp(16px, 2.4vw, 32px); text-align: center; flex: 1; letter-spacing: .5px; }
.tv-top .r { display: flex; align-items: center; gap: 1vw; }
.timer { font-family: var(--pix); font-size: clamp(18px, 2.6vw, 40px); min-width: 2.6em; text-align: right; }
.timer.low { color: var(--bad); animation: pulse .5s infinite alternate; }
@keyframes pulse { to { transform: scale(1.12); } }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; background: var(--glass2); border: 1px solid var(--line); font-size: 18px; display: flex; align-items: center; justify-content: center; }
.tv-main { position: relative; display: flex; align-items: center; align-items: safe center; justify-content: center; min-height: 0; overflow: hidden; }
.tv-main > * { width: 100%; }
.tbar { position: absolute; left: 18px; right: 18px; top: 8px; height: 6px; border-radius: 6px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.tbar i { display: block; height: 100%; background: linear-gradient(90deg, #5b8cff, #a77bff); transition: width .25s linear; }

.big-title { font-size: clamp(30px, 6vw, 96px); font-weight: 900; line-height: 1.05; text-align: center; }
.mid-title { font-size: clamp(22px, 3.4vw, 54px); font-weight: 900; text-align: center; line-height: 1.15; }
.desc { font-size: clamp(16px, 2vw, 30px); color: var(--txt2); text-align: center; max-width: 1100px; margin: 2vh auto 0; line-height: 1.35; font-weight: 700; }
.style-ic { font-size: clamp(54px, 9vw, 150px); text-align: center; line-height: 1; filter: drop-shadow(0 10px 25px rgba(0, 0, 0, .5)); }
.pop { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.fade { animation: fade .35s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* lobby TV */
.lobby { display: grid; grid-template-columns: 1.1fr 1fr; gap: 2vw; align-items: stretch; max-width: 1500px; margin: 0 auto; }
.lobby .panel { padding: 2.4vh 2vw; display: flex; flex-direction: column; }
.code-big { font-family: var(--pix); font-size: clamp(42px, 8vw, 130px); letter-spacing: .12em; text-align: center; color: #fff; text-shadow: 0 0 30px rgba(91, 140, 255, .6); margin: 1vh 0; }
.join-row { display: flex; gap: 2vw; align-items: center; justify-content: center; margin-top: 1vh; }
.qr { background: #fff; padding: 10px; border-radius: 14px; width: clamp(110px, 14vw, 210px); height: clamp(110px, 14vw, 210px); flex: none; }
.qr img, .qr canvas { width: 100% !important; height: 100% !important; }
.url { font-size: clamp(12px, 1.2vw, 18px); color: var(--txt2); word-break: break-all; font-weight: 700; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 90px; padding: 12px 10px; border-radius: 14px; background: rgba(8, 12, 32, .5); border: 2px solid var(--line); font-weight: 900; font-size: clamp(13px, 1.2vw, 18px); line-height: 1.15; }
.seg button small { display: block; font-weight: 700; color: var(--txt2); font-size: .75em; margin-top: 3px; }
.seg button.on { border-color: #6ea0ff; background: rgba(91, 140, 255, .22); box-shadow: 0 0 16px rgba(91, 140, 255, .4); }

/* tema / votação */
.vote-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vw; max-width: 1500px; margin: 3vh auto 0; }
.vote-card { padding: 3vh 1.4vw; text-align: center; position: relative; overflow: hidden; }
.vote-card h3 { font-size: clamp(18px, 2.4vw, 40px); font-weight: 900; min-height: 2.4em; display: flex; align-items: center; justify-content: center; }
.vote-card .n { font-family: var(--pix); font-size: clamp(26px, 4vw, 64px); margin-top: 1.5vh; }
.vote-card .fill { position: absolute; left: 0; bottom: 0; right: 0; background: linear-gradient(0deg, rgba(91, 140, 255, .45), rgba(91, 140, 255, 0)); transition: height .4s; z-index: -1; }
.vote-card.win { border-color: var(--gold); box-shadow: 0 0 40px rgba(251, 191, 36, .45); }
.weapons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vw; max-width: 1400px; margin: 3vh auto 0; }
.weapon { padding: 2.6vh 1.6vw; text-align: center; }
.weapon .ic { font-size: clamp(40px, 6vw, 96px); }
.weapon b { display: block; font-size: clamp(16px, 2vw, 32px); margin-top: 1vh; }
.weapon span { display: block; color: var(--txt2); font-size: clamp(13px, 1.3vw, 22px); margin-top: .6vh; font-weight: 700; }

/* pergunta */
.qwrap { max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.8vh; }
.qbox { padding: 2.4vh 2.4vw; text-align: center; position: relative; }
.qmeta { font-size: clamp(12px, 1.3vw, 20px); font-weight: 900; color: var(--txt2); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 1vh; }
.qtext { font-size: clamp(20px, min(3.2vw, 5.4vh), 58px); font-weight: 900; line-height: 1.2; }
.qemo { font-size: clamp(44px, min(8vw, 13vh), 150px); line-height: 1.15; letter-spacing: .08em; margin-top: .5vh; }
.clues { display: flex; flex-direction: column; gap: .9vh; margin-top: 1.2vh; text-align: left; }
.clue { padding: 1vh 1.4vw; border-radius: 14px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); font-size: clamp(15px, min(2vw, 3.4vh), 34px); font-weight: 800; transition: opacity .3s; }
.clue i { font-style: normal; font-family: var(--pix); font-size: .55em; color: var(--gold); margin-right: .8em; }
.clue.wait { opacity: .25; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6vh 1.4vw; }
.answers.two { grid-template-columns: 1fr 1fr; }
.ans {
  position: relative; display: flex; align-items: center; gap: 1.2vw; padding: 1.6vh 1.4vw; border-radius: 18px; min-height: 8.5vh;
  font-size: clamp(17px, min(2.4vw, 4.6vh), 44px); font-weight: 900; text-align: left; line-height: 1.15;
  border: 2px solid rgba(255, 255, 255, .22); box-shadow: 0 12px 26px -12px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .25);
  transition: opacity .3s, transform .3s, filter .3s;
}
.ans .sh { font-size: .8em; opacity: .9; flex: none; width: 1.2em; text-align: center; }
.ans .tx { flex: 1; letter-spacing: .02em; word-break: break-word; }
.ans .tx.masked { font-family: var(--pix); font-size: .62em; letter-spacing: .12em; line-height: 1.6; word-break: break-all; }
.c0 { background: linear-gradient(135deg, #ff5c6c, #d9263b); }
.c1 { background: linear-gradient(135deg, #5b8cff, #2f52e0); }
.c2 { background: linear-gradient(135deg, #ffc93c, #e08a00); color: #2b1a00; }
.c3 { background: linear-gradient(135deg, #2bd47a, #0e9a55); }
.cv { background: linear-gradient(135deg, #2bd47a, #0e9a55); }
.cf { background: linear-gradient(135deg, #ff5c6c, #d9263b); }
.ans.dim { opacity: .22; filter: grayscale(.7); }
.ans.right { transform: scale(1.03); box-shadow: 0 0 0 4px #fff, 0 0 40px rgba(255, 255, 255, .55); }
.ans .who { position: absolute; right: 10px; bottom: -14px; display: flex; gap: 4px; }
.ans .who canvas { width: 40px; height: 48px; image-rendering: pixelated; }

/* tira de jogadores */
.strip { display: flex; gap: 1vw; justify-content: center; align-items: stretch; flex-wrap: nowrap; }
.pcard { position: relative; flex: 0 1 220px; min-width: 0; padding: .8vh .6vw .9vh; text-align: center; display: flex; flex-direction: column; align-items: center; transition: opacity .3s, transform .3s, border-color .3s; }
.pcard .act { width: clamp(64px, min(7.5vw, 15vh), 130px); aspect-ratio: 26/32; position: relative; }
.pcard .act canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.pcard .nm { font-weight: 900; font-size: clamp(13px, 1.4vw, 22px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pcard .sc { font-family: var(--pix); font-size: clamp(10px, 1.05vw, 16px); color: var(--gold); margin-top: .4vh; }
.pcard .st { position: absolute; top: 6px; right: 8px; font-size: clamp(14px, 1.5vw, 24px); }
.pcard .kick { position: absolute; top: 4px; left: 6px; width: 26px; height: 26px; border-radius: 8px; background: rgba(239, 68, 68, .25); font-size: 14px; font-weight: 900; }
.pcard.off { opacity: .45; }
.pcard.done { border-color: rgba(34, 197, 94, .7); }
.pcard .delta { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-family: var(--pix); font-size: clamp(12px, 1.4vw, 22px); white-space: nowrap; pointer-events: none; animation: rise 2.2s ease-out forwards; text-shadow: 0 2px 0 #000; }
.delta.pos { color: #4ade80; } .delta.neg { color: #f87171; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -40px); } }
.tbarp { width: 90%; height: 8px; border-radius: 6px; background: rgba(255, 255, 255, .1); margin-top: .5vh; overflow: hidden; }
.tbarp i { display: block; height: 100%; background: linear-gradient(90deg, #22c55e, #a3e635); transition: width .3s linear; }
.tbarp i.low { background: linear-gradient(90deg, #ef4444, #f59e0b); }

/* ranking */
.rank { max-width: 1000px; margin: 2vh auto 0; display: flex; flex-direction: column; gap: 1vh; }
.rrow { display: flex; align-items: center; gap: 1.4vw; padding: 1.2vh 1.6vw; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); font-weight: 900; font-size: clamp(16px, 2vw, 32px); }
.rrow .pos { font-family: var(--pix); font-size: .7em; width: 2.2em; color: var(--gold); }
.rrow canvas { width: clamp(36px, 3.6vw, 60px); height: auto; aspect-ratio: 16/21; image-rendering: pixelated; }
.rrow .nm { flex: 1; }
.rrow .pts { font-family: var(--pix); font-size: .6em; color: var(--gold); }
.rrow .rp { font-family: var(--pix); font-size: .5em; color: #4ade80; min-width: 6em; text-align: right; }
.rrow.first { border-color: var(--gold); background: rgba(251, 191, 36, .12); }

.podium { display: flex; align-items: center; justify-content: center; gap: 3vw; }
.podium .winner { text-align: center; }
.podium .winner .act { width: clamp(120px, min(18vw, 30vh), 300px); aspect-ratio: 26/32; margin: 0 auto; }
.podium .rrow { padding: .8vh 1.4vw; }
.podium .crown { line-height: 1; }
.podium .winner .act canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.crown { font-size: clamp(30px, 4vw, 60px); }

/* feed (avisos) */
#feed { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 900px); }
body.is-tv #feed { top: 96px; left: auto; right: 2vw; transform: none; align-items: flex-end; width: min(44vw, 640px); }
.feed-it { padding: 10px 18px; border-radius: 16px; background: rgba(20, 16, 50, .92); border: 1px solid var(--line2); font-weight: 900; font-size: clamp(14px, 1.4vw, 22px); box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .8); animation: feedin .35s ease both; text-align: center; }
.feed-it.out { animation: feedout .4s ease forwards; }
@keyframes feedin { from { opacity: 0; transform: translateY(-14px) scale(.95); } to { opacity: 1; transform: none; } }
@keyframes feedout { to { opacity: 0; transform: translateY(-10px); } }

/* ---------- TELEMÓVEL ---------- */
#v-ph { padding: 0; align-items: stretch; justify-content: stretch; }
.ph { display: flex; flex-direction: column; width: 100%; height: 100%; max-width: 640px; margin: 0 auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); gap: 8px; }
.ph-top { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; gap: 8px; flex: none; }
.ph-top .l { font-size: 12px; font-weight: 900; color: var(--txt2); line-height: 1.2; max-width: 40%; }
.ph-top .l b { color: #fff; font-size: 14px; display: block; }
.ph-top .timer { font-size: 20px; min-width: 2em; text-align: center; }
.ph-top .icon-btn { width: 36px; height: 36px; font-size: 16px; flex: none; }
.icon-btn.off { opacity: .55; }
.ph-top .r { text-align: right; }
.ph-top .r .pix { font-size: 12px; color: var(--gold); display: block; }
.ph-top .r small { font-size: 10px; color: var(--txt2); font-weight: 800; }
.ph-stage { flex: none; padding: 10px 12px; }
.ph-stage .qtext { font-size: 18px; text-align: center; }
.ph-stage .qemo { font-size: 46px; text-align: center; margin: 0; }
.ph-stage .clue { font-size: 15px; padding: 7px 10px; }
.ph-stage .clues { gap: 6px; margin-top: 6px; }
.ph-stage .qmeta { font-size: 10px; text-align: center; }
.mini { display: flex; gap: 4px; justify-content: center; margin-top: 8px; }
.mini .m { flex: 1; max-width: 70px; text-align: center; position: relative; }
.mini .m .act { width: 100%; aspect-ratio: 26/32; }
.mini .m canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.mini .m .nm { font-size: 10px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .m .sc { font-family: var(--pix); font-size: 8px; color: var(--gold); margin-top: 2px; }

  if (ac === 'monoculo' && !back) {
    const G = '#E0B23A';
    for (let x = 10; x <= 12; x++) { p(x, ly - 1, G); p(x, ly + 2, G); }
    p(10, ly, G); p(12, ly, G); p(10, ly + 1, G); p(12, ly + 1, G);
    p(13, ly + 3, G); p(13, ly + 4, G); p(12, ly + 5, G);
  }
  if (ac === 'cachecol') {
    const y = a.sc, c = x => (x % 4 < 2 ? '#D9433B' : '#F4F1EA');
    for (let x = 2; x < 14; x++) p(x, y, c(x));
    for (let x = 3; x < 13; x++) p(x, y + 1, c(x));
    [[10, y + 2], [11, y + 2], [10, y + 3], [11, y + 3]].forEach(q => p(q[0], q[1], '#D9433B'));
  }
}

const INK_PTS = [[3, -1], [4, -1], [4, 0], [5, 1], [6, 1], [6, 2], [10, 0], [11, 0], [11, 1], [12, 2], [12, 3], [8, 3], [9, 3], [9, 4], [3, 3], [4, 4], [7, 5], [7, 6], [12, 5], [2, 1], [5, 3], [10, 4]];
function sprFx(p, a, fx) {
  if (fx === 'ink') {
    INK_PTS.forEach(([x, y]) => p(x, a.ly + y, '#0b0b10'));
  } else if (fx === 'pie') {
    for (let y = a.ly - 1; y <= a.ly + 4; y++) for (let x = 2; x <= 13; x++) {
      if ((y === a.ly - 1 || y === a.ly + 4) && (x < 4 || x > 11)) continue;
      p(x, y, '#FFF3D6');
    }
    [[4, a.ly], [9, a.ly + 1], [6, a.ly + 3], [11, a.ly + 3], [3, a.ly + 2]].forEach(([x, y]) => p(x, y, '#F48FB1'));
    p(8, a.ly - 2, '#D7263D'); p(8, a.ly - 3, '#2F7D32');
  }
}

const SPR_CACHE = new Map();
function sprSheet(anim, acc, face, back, fx) {
  const key = anim + '|' + acc + '|' + face + '|' + (back ? 1 : 0) + '|' + (fx || '');
  let c = SPR_CACHE.get(key);
  if (c) return c;
  c = document.createElement('canvas'); c.width = 16; c.height = SPR_ROWS;
  const g = c.getContext('2d');
  const a = ANIMALS[anim] || ANIMALS.urso;
  const p = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y + a.off, 1, 1); };
  const sw = { L: 'M', N: 'M', E: 'D', W: 'M', P: 'M' };
  a.m.forEach((row, y) => {
    for (let x = 0; x < 16; x++) {
      let ch = row[x];
      if (ch === '.') continue;
      if (back && ch !== 'O') ch = sw[ch] || ch;
      p(x, y, ch === 'K' ? SPR_K : a.c[ch]);
    }
  });
  if (!back) { sprFace(p, a, face); if (fx) sprFx(p, a, fx); }
  sprAcc(p, a, acc, back);
  SPR_CACHE.set(key, c);
  return c;
}

// desenho estático (grelhas de escolha, listas)
function drawStatic(cv, anim, acc, face) {
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, cv.width, cv.height);
  const s = sprSheet(anim, acc || 'nada', face || 'normal', false, null);
  const P = Math.floor(Math.min(cv.width / 16, cv.height / SPR_ROWS));
  const W = 16 * P, H = SPR_ROWS * P;
  g.drawImage(s, Math.round((cv.width - W) / 2), Math.round((cv.height - H) / 2), W, H);
}

class Actor {
  constructor(cv, P, anim, acc) {
    this.cv = cv; this.g = cv.getContext('2d'); this.P = P;
    this.a = anim; this.ac = acc || 'nada';
    this.expr = 'normal'; this.fx = null; this.dim = false; this.loopAnim = null;
    this.play('idle');
  }
  set(o) { Object.assign(this, o); }
  play(n, loop) {
    if (!ANIMS[n]) n = 'idle';
    if (loop !== undefined) this.loopAnim = loop ? n : null;
    this.n = n; this.fr = ANIMS[n].f; this.fc = ANIMS[n].face; this.i = 0;
    clearTimeout(this.tm); this.step();
  }
  step() {
    if (!this.cv.isConnected) { this.dead = true; return; }
    const f = this.fr[this.i];
    let fc = f.face || this.fc || this.expr;
    if (this.n === 'idle' && this.expr === 'normal' && Math.random() < .15) fc = 'piscar';
    this.draw(f, fc);
    this.tm = setTimeout(() => {
      this.i++;
      if (this.i >= this.fr.length) {
        if (this.n !== 'idle') { this.play(this.loopAnim || 'idle'); return; }
        this.i = 0;
      }
      this.step();
    }, f.t || 100);
  }
  redraw() { if (this.fr) this.draw(this.fr[this.i] || {}, this.fc || this.expr); }
  draw(f, fc) {
    const g = this.g, P = this.P, W = 16 * P, H = SPR_ROWS * P;
    const cw = this.cv.width, ch = this.cv.height;
    const cx = Math.round(cw / 2), gr = ch - P, dy = f.dy || 0;
    g.clearRect(0, 0, cw, ch);
    g.imageSmoothingEnabled = false;
    g.globalAlpha = this.dim ? 0.35 : 1;
    const sw = Math.round(12 * (1 - Math.min(.6, -dy / 16))) * P;
    g.fillStyle = 'rgba(0,0,0,.28)';
    g.fillRect(Math.round(cx - sw / 2), gr - 2 * P, sw, P);
    const sheet = sprSheet(this.a, this.ac, fc, !!f.back, f.back ? null : this.fx);
    g.save();
    g.translate(cx + (f.dx || 0) * P, gr + dy * P);
    g.scale(f.sx || 1, f.sy || 1);
    g.translate(0, -H / 2);
    g.rotate((f.rot || 0) * Math.PI / 180);
    g.drawImage(sheet, -W / 2, -H / 2, W, H);
    g.restore();
    g.globalAlpha = 1;
  }
  destroy() { clearTimeout(this.tm); this.dead = true; }
}

}

   REDE: PeerJS (WebRTC) ou modo local (várias abas, para testes)
   ========================================================= */
const NET_PREFIX = 'saber-sobreviver-v2-';
const URLP = new URLSearchParams(location.search);
const NET_LOCAL = URLP.has('local') || typeof Peer === 'undefined';
// opcional: servidor PeerJS próprio (?peerhost=...&peerport=...&peerpath=...&peersecure=1)
const PEER_OPTS = (() => {
  const o = { debug: 1 };
  const h = URLP.get('peerhost');
  if (h) { o.host = h; o.port = +(URLP.get('peerport') || 443); o.path = URLP.get('peerpath') || '/'; o.secure = URLP.get('peersecure') !== '0'; }
  if (URLP.has('noice')) o.config = { iceServers: [] };
  return o;
})();
const PEER_PARAMS = ['peerhost', 'peerport', 'peerpath', 'peersecure', 'noice'].filter(k => URLP.has(k)).map(k => '&' + k + '=' + encodeURIComponent(URLP.get(k))).join('');

class Link {
  constructor() { this.h = {}; this.open = false; }
  on(ev, fn) { this.h[ev] = fn; return this; }
  emit(ev, ...a) { if (this.h[ev]) this.h[ev](...a); }
}

// ---------- ANFITRIÃO ----------
function netHost(code, cb) {
  // cb: { ready(), conn(link), error(type, msg) }
  if (NET_LOCAL) {
    const bc = new BroadcastChannel('ss-local');
    const conns = {};
    bc.onmessage = e => {
      const m = e.data;
      if (!m || m.to !== code) return;
      if (m.k === 'hello') {
        const L = new Link(); L.id = m.from; L.open = true;
        L.send = d => bc.postMessage({ to: m.from, from: code, k: 'data', d });
        L.close = () => bc.postMessage({ to: m.from, from: code, k: 'bye' });
        conns[m.from] = L;
        bc.postMessage({ to: m.from, from: code, k: 'ok' });
        cb.conn(L);
      } else if (m.k === 'data' && conns[m.from]) {
        conns[m.from].emit('data', m.d);
      } else if (m.k === 'bye' && conns[m.from]) {
        const L = conns[m.from]; L.open = false; delete conns[m.from]; L.emit('close');
      }
    };
    setTimeout(() => cb.ready(), 50);
    return { destroy() { bc.close(); } };
  }
  const peer = new Peer(NET_PREFIX + code, PEER_OPTS);
  let ready = false;
  peer.on('open', () => { ready = true; cb.ready(); });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') cb.error('taken');
    else if (!ready) cb.error(err.type, 'Não foi possível criar a sala (' + err.type + '). Verifica a internet.');
    else console.warn('peer error', err.type);
  });
  peer.on('disconnected', () => { setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) { } }, 1500); });
  peer.on('connection', c => {
    const L = new Link(); L.id = c.peer;
    L.send = d => { if (c.open) { try { c.send(d); } catch (e) { } } };
    L.close = () => { try { c.close(); } catch (e) { } };
    c.on('open', () => { L.open = true; cb.conn(L); });
    c.on('data', d => L.emit('data', d));
    c.on('close', () => { if (L.open) { L.open = false; L.emit('close'); } });
    c.on('error', () => { });
    // alguns browsers não disparam "close" quando o telemóvel bloqueia
    const iv = setInterval(() => {
      if (L.open && c.peerConnection && ['failed', 'closed', 'disconnected'].includes(c.peerConnection.iceConnectionState)) {
        if (c.peerConnection.iceConnectionState !== 'disconnected') { L.open = false; L.emit('close'); clearInterval(iv); }
      }
      if (!L.open) clearInterval(iv);
    }, 3000);
  });
  return peer;
}

// ---------- CLIENTE ----------
function netJoin(code, cb) {
  // cb: { open(link), data(d), close(), fail(msg) }
  if (NET_LOCAL) {
    const bc = new BroadcastChannel('ss-local');
    const me = 'c' + Math.random().toString(36).slice(2, 9);
    let ok = false;
    const L = new Link();
    L.send = d => bc.postMessage({ to: code, from: me, k: 'data', d });
    L.close = () => { bc.postMessage({ to: code, from: me, k: 'bye' }); bc.close(); };
    bc.onmessage = e => {
      const m = e.data;
      if (!m || m.to !== me) return;
      if (m.k === 'ok') { ok = true; L.open = true; cb.open(L); }
      else if (m.k === 'data') cb.data(m.d);
      else if (m.k === 'bye') { L.open = false; cb.close(); }
    };
    bc.postMessage({ to: code, from: me, k: 'hello' });
    setTimeout(() => { if (!ok) { bc.close(); cb.fail('Sala não encontrada. Confirma o código.'); } }, 2500);
    return L;
  }
  const L = new Link();
  const peer = new Peer(PEER_OPTS);
  let ok = false, failed = false;
  const fail = msg => { if (ok || failed) return; failed = true; try { peer.destroy(); } catch (e) { } cb.fail(msg); };
  peer.on('open', () => {
    const c = peer.connect(NET_PREFIX + code, { reliable: true, serialization: 'json' });
    L.send = d => { if (c.open) { try { c.send(d); } catch (e) { } } };
    L.close = () => { try { c.close(); peer.destroy(); } catch (e) { } };
    c.on('open', () => { ok = true; L.open = true; cb.open(L); });
    c.on('data', d => cb.data(d));
    c.on('close', () => { if (L.open) { L.open = false; cb.close(); } });
    c.on('error', () => { });
    const iv = setInterval(() => {
      if (L.open && c.peerConnection && ['failed', 'closed'].includes(c.peerConnection.iceConnectionState)) {
        L.open = false; clearInterval(iv); cb.close();
      }
      if (!L.open && ok) clearInterval(iv);
    }, 3000);
  });
  peer.on('error', err => {
    if (err.type === 'peer-unavailable') fail('Sala não encontrada. Confirma o código.');
    else if (!ok) fail('Erro de ligação (' + err.type + '). Verifica a internet.');
    else if (['network', 'disconnected', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) { /* a ligação direta pode continuar */ }
  });
  setTimeout(() => fail('A ligação demorou demasiado. Tenta outra vez.'), 15000);
  return L;
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }

function itemId(kind, it) { return kind + ':' + hashStr(JSON.stringify(it[0]) + '|' + it[1]); }

const POOL_CACHE = {};
function getPool(aud, kind) {
  const key = aud + '/' + kind;
  if (POOL_CACHE[key]) return POOL_CACHE[key];
  const srcs = aud === 'familia' ? ['geral', 'sub12'] : [aud];
  const out = {};
  for (const s of srcs) {
    const p = (QDB[s] && QDB[s][kind]) || {};
    for (const c in p) {
      if (!out[c]) out[c] = [];
      for (const it of p[c]) {
        const id = itemId(kind, it);
        if (!out[c].some(x => x.id === id)) out[c].push({ id, it, cat: c });
      }
    }
  }
  POOL_CACHE[key] = out;
  return out;
}
function unusedCount(list) { return list.filter(x => !USED[x.id]).length; }

function engHeartbeat() {
  const S = ENG.S, now = Date.now();
  if (!S) return;
  for (const p of plist()) {
    if (p.id === ENG.localPid || !p.on) continue;
    const t = ENG.seen[p.id];
    if (t && now - t > 12000) {
      p.on = false;
      if (S.phase !== 'LOBBY') feed('📵 ' + p.name + ' perdeu a ligação', 'off', p.id);

    const old = ENG.links[pid];
    if (old && old !== L) { try { old.close(); } catch (e) { } }
    p.on = true; ENG.links[pid] = L; L.pid = pid; ENG.seen[pid] = Date.now();
    L.send({ t: 'W', pid, token: d.token, code: S.code, mode: S.mode });
    if (S.phase !== 'LOBBY') feed('🔌 ' + p.name + ' voltou!', 'on', pid);
    engPush();
    return;
  }
  if (S.phase !== 'LOBBY') { L.send({ t: 'E', msg: 'O jogo já começou. Espera pelo próximo!' }); return; }
  if (S.order.length >= 6) { L.send({ t: 'E', msg: 'A sala está cheia (máximo 6 jogadores).' }); return; }
  pid = 'p' + (ENG.nextPid++);
  const token = d.token || rid(12);
  ENG.tokens[token] = pid;
  S.players[pid] = newPlayer(pid, d);
  S.order.push(pid);
  ENG.links[pid] = L; L.pid = pid; ENG.seen[pid] = Date.now();
  L.send({ t: 'W', pid, token, code: S.code, mode: S.mode });
  engPush();
}

function engAddLocal(d) {
  const S = ENG.S;
  const pid = 'p0';
  S.players[pid] = newPlayer(pid, d);
  S.order.push(pid);
  ENG.localPid = pid;
  return pid;
}

/* ---------- mensagens dos jogadores ---------- */
function engMsg(pid, m) {
  const S = ENG.S, H = ENG.H, p = S.players[pid];
  if (!p) return;
  switch (m.t) {
    case 'V': // voto
      if (S.phase !== 'VOTE' || p.voted || !S.vote) return;
      if (!(m.i >= 0 && m.i < S.vote.opts.length)) return;
      p.voted = true; H.votes[pid] = m.i; S.vote.cnt[m.i]++;
      engPush(); engCheckAll();
      break;
    case 'A': // ataque
      if (S.phase !== 'ATTACK' || p.atk) return;
      p.atk = true;
      if (m.w && m.to && m.to !== pid && S.players[m.to]) {
        const v = S.players[m.to];
        if (m.w === 'roubo') {
          const amt = Math.min(250, v.score);
          v.score -= amt; p.score += amt;
          if (amt > 0) feed('💰 ' + p.name + ' roubou ' + amt + ' pontos a ' + v.name + '!', 'roubo', pid, v.id);
          else feed('😅 ' + p.name + ' tentou roubar ' + v.name + ', mas não havia pontos para levar!', 'roubo0', pid, v.id);
        } else if (m.w === 'ink' || m.w === 'pie') {
          H.hits.push({ to: v.id, w: m.w, from: p.name, fromId: pid, qi: Math.floor(Math.random() * Math.max(1, S.nq)) });
        }
      }
      engPush(); engCheckAll();
      break;
    case 'B': // aposta
      if (S.phase !== 'BET' || p.bet != null) return;
      if (!BET_OPTS.includes(m.v)) return;
      p.bet = m.v;
      engPush(); engCheckAll();
      break;
    case 'R': // resposta
      if ((S.phase !== 'Q' && S.phase !== 'FQ') || !S.q || m.k !== S.q.k || H.ans[pid]) return;
      if (S.phase === 'FQ' && !p.alive) return;
      if (!(m.i >= 0 && m.i < S.q.ans.length)) return;
      H.ans[pid] = { i: m.i, at: Date.now() - H.qStart, clues: S.q.clues ? S.q.clues.length : 0 };
      p.ans = true;
      if (S.phase === 'Q' && S.style === 'certeiro' && m.i === H.correct) engHurry(450);
      engPush(); engCheckAll();
      break;
    case 'C': // limpou tinta/tarte
      if (p.hit) { p.hit.cleared = true; engPush(); }
      break;
    case 'X': // saiu
      if (S.phase === 'LOBBY') engKick(pid, true);
      break;
  }
}

function engCheckAll() {
  const S = ENG.S, act = activeList();
  if (!act.length) return;
  if (S.phase === 'VOTE' && act.every(p => p.voted)) engHurry(900);
  else if (S.phase === 'ATTACK' && act.every(p => p.atk)) engHurry(900);
  else if (S.phase === 'BET' && act.every(p => p.bet != null)) engHurry(700);
  else if ((S.phase === 'Q' || S.phase === 'FQ') && act.every(p => p.ans)) engHurry(600);
}

/* ---------- ações do anfitrião ---------- */
function engAction(a, d) {
  const S = ENG.S;
  if (a === 'opts' && S.phase === 'LOBBY') {
    if (['geral', 'familia', 'sub12'].includes(d.aud)) S.aud = d.aud;
    if ([3, 5, 7].includes(d.len)) S.len = d.len;
    engPush();
  } else if (a === 'start' && S.phase === 'LOBBY') engStart();
  else if (a === 'skip') engHurry(0);
  else if (a === 'kick') engKick(d.pid);
  else if (a === 'again' && S.phase === 'END') engLobby();
}

function engKick(pid, self) {
  const S = ENG.S;
  if (S.phase !== 'LOBBY' || !S.players[pid] || pid === ENG.localPid) return;
  const L = ENG.links[pid];
  if (L) { if (!self) L.send({ t: 'E', msg: 'Foste removido da sala.', kick: 1 }); setTimeout(() => { try { L.close(); } catch (e) { } }, 300); }
  delete ENG.links[pid];
  delete S.players[pid];
  S.order = S.order.filter(x => x !== pid);
  for (const tk in ENG.tokens) if (ENG.tokens[tk] === pid) delete ENG.tokens[tk];
  engPush();
}

function engLobby() {
  const S = ENG.S;
  clearInterval(ENG.tm);
  // remove quem saiu
  for (const pid of S.order.slice()) if (!S.players[pid].on) { delete S.players[pid]; S.order = S.order.filter(x => x !== pid); }
  for (const p of plist()) Object.assign(p, { score: 0, ans: false, voted: false, atk: false, bet: null, hit: null, last: null, roundPts: 0, streak: 0, time: 0, alive: true });
  Object.assign(S, { phase: 'LOBBY', round: 0, style: null, styles: [], vote: null, cat: null, q: null, qi: 0, nq: 0, rank: null, winner: null, fin: null, t: 0, tMax: 0, catHist: [] });
  engPush();
}

/* ---------- relógio das fases ---------- */
function engPhase(name, dur, onEnd) {
  const S = ENG.S, H = ENG.H;
  clearInterval(ENG.tm);
  S.phase = name; S.tMax = dur; S.t = Math.ceil(dur);
  H.deadline = Date.now() + dur * 1000 / SPEED; H.onEnd = onEnd || null;
  engPush();
  if (dur > 0 || (S.fin && S.fin.running)) ENG.tm = setInterval(engTick, 100);
}
function engHurry(ms) { const H = ENG.H; if (H.onEnd) H.deadline = Math.min(H.deadline, Date.now() + ms); }

function engTick() {
  const S = ENG.S, H = ENG.H, now = Date.now();
  const rem = Math.max(0, H.deadline - now);
  let ch = false;
  const t = Math.ceil(rem * SPEED / 1000);
  if (t !== S.t) { S.t = t; ch = true; }
  if (S.phase === 'Q') ch = engLive(now) || ch;
  if (S.fin && S.fin.running) {
    const r = engFinalClock(now);
    if (r === 'over') return;
    ch = r || ch;
  }
  if (ch) engPush();
  if (rem <= 0 && H.onEnd) { const f = H.onEnd; H.onEnd = null; f(); }
}

/* ---------- jogo ---------- */
function engStart() {
  const S = ENG.S;
  if (!S.order.length) return;
  for (const p of plist()) Object.assign(p, { score: 0, last: null, alive: true, time: 0, roundPts: 0, streak: 0, hit: null, bet: null, ans: false, voted: false, atk: false });
  const others = shuffle(['certeiro', 'letras', 'emojis', 'pistas', 'aposta', 'vf']).slice(0, 4);
  S.styles = ['rapido', ...others];
  // só para testes: ?styles=pistas,vf,...
  const forced = (new URLSearchParams(location.search).get('styles') || '').split(',').filter(x => STYLE_DEF[x]);
  if (forced.length) S.styles = forced.concat(S.styles).slice(0, S.nRounds);
  Object.assign(S, { round: 0, rank: null, winner: null, fin: null, feed: [], catHist: [] });
  ENG.H = { ans: {}, votes: {}, hits: [] };
  engNextRound();
}

function engNextRound() {
  const S = ENG.S;
  S.round++;
  if (S.round > S.nRounds) return engFinalIntro();
  S.style = S.styles[S.round - 1];
  Object.assign(S, { cat: null, vote: null, q: null, qi: 0 });
  S.nq = S.len * (S.style === 'vf' ? 2 : 1);
  for (const p of plist()) Object.assign(p, { roundPts: 0, atk: false, voted: false, hit: null, bet: null, ans: false, last: null });
  engPhase('INTRO', 7, engVote);
}

function engVote() {
  const S = ENG.S;
  const opts = engPickCats(3);
  S.vote = { opts, cnt: opts.map(() => 0), win: null };
  ENG.H.votes = {};
  for (const p of plist()) p.voted = false;
  if (opts.length <= 1) { S.cat = opts[0]; S.vote.win = 0; return engPhase('THEME', 3, engAttack); }
  engPhase('VOTE', 12, engEndVote);
}

function engEndVote() {
  const S = ENG.S, c = S.vote.cnt;
  const max = Math.max(...c);
  const wins = c.map((n, i) => (n === max ? i : -1)).filter(i => i >= 0);
  const w = wins[Math.floor(Math.random() * wins.length)];
  S.vote.win = w; S.cat = S.vote.opts[w];
  S.catHist.push(S.cat);
  engPhase('THEME', 4, engAttack);
}

function engAttack() {
  const S = ENG.S, H = ENG.H;
  H.items = engPickItems(S.cat, S.nq);
  S.nq = H.items.length;
  H.hits = [];
  for (const p of plist()) p.atk = false;
  if (plist().length < 2) return engNextQ();
  engPhase('ATTACK', 15, engNextQ);
}

function engNextQ() {
  const S = ENG.S, H = ENG.H;
  if (S.qi >= S.nq) return engPhase('RANK', 8, engNextRound);
  const entry = H.items[S.qi];
  for (const p of plist()) Object.assign(p, { ans: false, last: null, hit: null });
  engBuildQ(entry, S.style);
  if (S.style === 'aposta') {
    for (const p of plist()) p.bet = null;
    engPhase('BET', 9, () => { for (const p of plist()) if (p.bet == null) p.bet = 100; engReady(); });
  } else engReady();
}

function engReady() { engPhase('READY', ENG.S.style === 'vf' ? 1.2 : 2.5, engStartQ); }

function engStartQ() {
  const S = ENG.S, H = ENG.H;
  H.ans = {};
  for (const h of H.hits) if (h.qi === S.qi && S.players[h.to]) {
    const v = S.players[h.to];
    if (!v.hit) {
      v.hit = { w: h.w, from: h.from, k: S.q.k };
      feed((h.w === 'ink' ? '💥 ' + h.from + ' atirou uma bomba de tinta a ' : '🥧 ' + h.from + ' atirou uma tarte a ') + v.name + '!', h.w, h.fromId, v.id);
    }
  }
  S.q.live = true;
  // no modo crianças há um pouco mais de tempo para ler
  const dur = STYLE_DEF[S.style].dur + (S.aud === 'sub12' ? (S.style === 'vf' ? 2 : 3) : 0);
  engPhase('Q', dur, engReveal);
  H.qStart = Date.now();
  H.qDur = dur * 1000 / SPEED;
}

function engBuildQ(entry, style) {
  const S = ENG.S, H = ENG.H, it = entry.it;
  const kind = STYLE_DEF[style] ? STYLE_DEF[style].pool : 'mc';
  const q = { k: S.qi + '-' + rid(4), n: S.qi + 1, of: S.nq, kind, cat: entry.cat, live: false };
  if (kind === 'vf') {
    q.text = it[0]; q.ans = ['Verdadeiro', 'Falso'];
    H.correct = it[1] ? 0 : 1;
  } else {
    const opts = shuffle([0, 1, 2, 3]);
    q.ans = opts.map(i => it[1 + i]);
    H.correct = opts.indexOf(0);
    if (kind === 'mc') q.text = it[0];
    if (kind === 'emo') { q.emo = it[0]; q.text = EMO_PROMPT[entry.cat] || 'Decifra o enigma!'; }
    if (kind === 'pis') { H.clues = it[0]; q.clues = [it[0][0]]; q.text = PIS_PROMPT[entry.cat] || 'O que é?'; }
  }
  if (style === 'letras') {
    H.full = q.ans.slice();
    H.order = q.ans.map(a => shuffle([...a].map((ch, i) => (/[\p{L}\p{N}]/u.test(ch) ? i : -1)).filter(i => i >= 0)));
    H.shown = -1;
    q.ans = engMask(0);
    q.masked = true;
  }
  S.q = q;
}

function engMask(frac) {
  const H = ENG.H;
  return H.full.map((a, k) => {
    const ord = H.order[k];
    const n = Math.max(1, Math.ceil(ord.length * frac));
    const show = new Set(ord.slice(0, n));
    return [...a].map((ch, i) => (/[\p{L}\p{N}]/u.test(ch) && !show.has(i) ? '_' : ch)).join('');
  });
}

function engLive(now) {
  const S = ENG.S, H = ENG.H, q = S.q;
  if (!q || !q.live) return false;
  const el = now - H.qStart;
  if (S.style === 'letras') {
    const frac = Math.min(1, 0.15 + 0.85 * el / (H.qDur * 0.8));
    const step = Math.floor(frac * 20);
    if (step !== H.shown) { H.shown = step; q.ans = engMask(frac); return true; }
  }
  if (S.style === 'pistas') {
    const n = Math.min(3, 1 + Math.floor(el * SPEED / 5000));
    if (n !== q.clues.length) { q.clues = H.clues.slice(0, n); return true; }
  }
  return false;
}

function engReveal() {
  const S = ENG.S, H = ENG.H, q = S.q, st = S.style, cor = H.correct;
  q.live = false;
  if (st === 'letras') { q.ans = H.full.slice(); q.masked = false; }
  if (st === 'pistas') q.clues = H.clues.slice();
  q.correct = cor;
  q.picks = {};
  const ok = Object.entries(H.ans).filter(([, a]) => a.i === cor).sort((a, b) => a[1].at - b[1].at);
  const okRank = {}; ok.forEach(([pid], i) => (okRank[pid] = i));
  const dur = H.qDur;
  for (const p of plist()) {
    const a = H.ans[p.id];
    let pts = 0, res = a ? (a.i === cor) : null;
    if (a) q.picks[p.id] = a.i;
    if (st === 'rapido') { if (res) pts = RANK_PTS[okRank[p.id]] || 300; }
    else if (st === 'certeiro') { if (res) pts = okRank[p.id] === 0 ? 1000 : 0; else if (res === false) pts = -250; }
    else if (st === 'letras') { if (res) pts = Math.round(Math.max(300, Math.min(1000, 1000 - 700 * a.at / dur)) / 10) * 10; }
    else if (st === 'emojis') { if (res) pts = Math.round(Math.max(400, Math.min(1000, 1000 - 600 * a.at / dur)) / 10) * 10; }
    else if (st === 'pistas') { if (res) pts = [1000, 700, 400][Math.max(0, Math.min(2, (a.clues || 1) - 1))]; }
    else if (st === 'aposta') { const b = p.bet || 100; pts = res ? b : -b; }
    else if (st === 'vf') { if (res) pts = Math.round(Math.max(200, Math.min(500, 500 - 300 * a.at / dur)) / 10) * 10; else if (res === false) pts = -100; }
    const before = p.score;
    p.score = Math.max(0, p.score + pts);
    const real = p.score - before;
    p.roundPts += real;
    p.streak = res ? p.streak + 1 : 0;
    p.last = { ok: res, pts: real, i: a ? a.i : null, first: st === 'certeiro' && okRank[p.id] === 0 };
    p.hit = null;
  }
  engPhase('REVEAL', st === 'vf' ? 2.5 : 5, () => { S.qi++; engNextQ(); });
}

/* ---------- escolha de temas e perguntas ---------- */
function engPickCats(n) {
  const S = ENG.S, kind = STYLE_DEF[S.style].pool;
  const pool = getPool(S.aud, kind);
  const need = S.nq;
  let cats = Object.keys(pool).filter(c => pool[c].length > 0);
  let good = cats.filter(c => unusedCount(pool[c]) >= need);
  if (good.length < n) {
    cats.forEach(c => { if (unusedCount(pool[c]) < need) resetUsed(pool[c]); });
    good = cats.filter(c => pool[c].length >= need);
    if (good.length < n) good = cats;
  }
  // prefere temas que ainda não saíram neste jogo
  const fresh = shuffle(good.filter(c => !S.catHist.includes(c)));
  const old = shuffle(good.filter(c => S.catHist.includes(c)));
  return fresh.concat(old).slice(0, n);
}

function engPickItems(cat, n) {
  const S = ENG.S, kind = STYLE_DEF[S.style].pool;
  const list = getPool(S.aud, kind)[cat] || [];
  const fresh = shuffle(list.filter(x => !USED[x.id]));
  const old = shuffle(list.filter(x => USED[x.id]));
  const pick = fresh.concat(old).slice(0, n);
  pick.forEach(x => (USED[x.id] = 1));
  saveUsed();
  return pick;
}

/* ---------- GRANDE FINAL ---------- */
function engFinalIntro() {
  const S = ENG.S, H = ENG.H;
  const ps = plist();
  const sc = ps.map(p => p.score);
  const mn = Math.min(...sc), mx = Math.max(...sc);
  H.ms = {};
  for (const p of ps) {
    const t = mx === mn ? 60 : Math.round(FINAL_MIN + (FINAL_MAX - FINAL_MIN) * (p.score - mn) / (mx - mn));
    Object.assign(p, { time: t, alive: true, hit: null, last: null, ans: false, bet: null });
    H.ms[p.id] = t * 1000;
  }
  S.style = 'final'; S.q = null; S.cat = null;
  S.fin = { n: 0, running: false, elim: [], solo: ps.length === 1 };
  // perguntas da final: todos os temas, primeiro as que ainda não saíram
  const pool = getPool(S.aud, 'mc');
  let all = [];
  for (const c in pool) all = all.concat(pool[c]);
  H.fq = shuffle(all.filter(x => !USED[x.id])).concat(shuffle(all.filter(x => USED[x.id])));
  engPhase('FINTRO', 12, engFinalNext);
}

function engFinalNext() {
  const S = ENG.S, H = ENG.H;
  if (engFinalOver()) return;
  const entry = H.fq[S.fin.n % H.fq.length];
  USED[entry.id] = 1; saveUsed();
  S.fin.n++;
  S.qi = S.fin.n - 1; S.nq = 0;
  engBuildQ(entry, 'final');
  S.q.n = S.fin.n; S.q.of = 0; S.q.live = true;
  H.ans = {};
  for (const p of plist()) { p.ans = false; p.last = null; }
  if (!S.fin.running) { S.fin.running = true; H.lastClock = Date.now(); }
  const dur = S.aud === 'sub12' ? 10 : S.aud === 'familia' ? 9 : 8;
  engPhase('FQ', dur, engFinalEval);
  H.qStart = Date.now(); H.qDur = dur * 1000 / SPEED;
}

function engFinalEval() {
  const S = ENG.S, H = ENG.H, q = S.q;
  q.live = false; q.correct = H.correct; q.picks = {};
  for (const p of plist()) {
    if (!p.alive) continue;
    const a = H.ans[p.id];
    let dt = 0, ok = null;
    if (!a) dt = -5;
    else { q.picks[p.id] = a.i; ok = a.i === H.correct; if (!ok) dt = -10; }
    H.ms[p.id] += dt * 1000;
    p.time = Math.max(0, Math.ceil(H.ms[p.id] / 1000));
    p.last = { ok, dt, i: a ? a.i : null };
  }
  engFinalElims();
  if (engFinalOver()) return;
  engPhase('FREV', 2.5, engFinalNext);
}

function engFinalElims() {
  const S = ENG.S, H = ENG.H;
  const dead = plist().filter(p => p.alive && H.ms[p.id] <= 0).sort((a, b) => H.ms[a.id] - H.ms[b.id]);
  for (const p of dead) {
    p.alive = false; p.time = 0;
    S.fin.elim.push(p.id);
    feed('💀 ' + p.name + ' ficou sem tempo!', 'elim', p.id);
  }
  return dead.length > 0;
}

function engFinalClock(now) {
  const S = ENG.S, H = ENG.H;
  const dt = (now - H.lastClock) * SPEED; H.lastClock = now;
  let ch = false;
  for (const p of plist()) {
    if (!p.alive) continue;
    H.ms[p.id] -= dt;
    const t = Math.max(0, Math.ceil(H.ms[p.id] / 1000));
    if (t !== p.time) { p.time = t; ch = true; }
  }
  if (engFinalElims()) {
    ch = true;
    if (engFinalOver()) return 'over';
  }
  return ch;
}

function engFinalOver() {
  const S = ENG.S, H = ENG.H;
  const ps = plist();
  const alive = ps.filter(p => p.alive);
  if (!((ps.length > 1 && alive.length <= 1) || alive.length === 0)) return false;
  S.fin.running = false;
  const rank = alive.sort((a, b) => H.ms[b.id] - H.ms[a.id]).map(p => p.id).concat(S.fin.elim.slice().reverse());
  S.rank = rank; S.winner = rank[0];
  S.q = null;
  const w = S.players[S.winner];
  if (w) feed(S.fin.solo ? '🏁 Sobreviveste a ' + S.fin.n + ' perguntas!' : '🏆 ' + w.name + ' é o grande sobrevivente!', 'win', w.id);
  engPhase('END', 0, null);
  return true;
}


/* =========================================================
   INTERFACE: ecrã principal (TV) e comando (telemóvel)
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SHAPES = ['▲', '◆', '●', '■'];
const AUD_LBL = { geral: ['Geral', 'adultos'], familia: ['Família', 'misto, 12+'], sub12: ['Crianças', 'até 12 anos'] };
const LEN_LBL = { 3: ['Rápido', '5×3 perguntas'], 5: ['Médio', '5×5 perguntas'], 7: ['Longo', '5×7 perguntas'] };
const WEAPONS = {
  ink: { ic: '💣', nome: 'Bomba de tinta', desc: 'Enche-lhe o ecrã de tinta preta. Tem de tocar para limpar.' },
  pie: { ic: '🥧', nome: 'Tarte na cara', desc: 'Tapa-lhe o ecrã com creme. Tem de passar o dedo para limpar.' },
  roubo: { ic: '💰', nome: 'Ladrão de pontos', desc: 'Rouba-lhe 250 pontos já!' }
};

/* ---------- utilitários ---------- */
function showView(id) {
  ['v-home', 'v-create', 'v-join', 'v-avatar', 'v-tv', 'v-ph'].forEach(v => $(v).classList.toggle('hidden', v !== id));
}
let toastTm;
function toast(msg, info) {
  const t = $('toast');
  t.textContent = msg; t.className = info ? 'info' : '';
  clearTimeout(toastTm); toastTm = setTimeout(() => t.classList.add('hidden'), 3800);
}
function patch(el, key, build) {
  if (G.keys[el.id] === key) return false;
  G.keys[el.id] = key;
  el.innerHTML = '';
  build(el);
  return true;
}
function staticAv(anim, acc, face, w, h) {
  const c = document.createElement('canvas');
  c.width = w || 48; c.height = h || 63;
  drawStatic(c, anim, acc, face);
  return c;
}
function avHTML(p, w, h) { return `<canvas data-av="${esc(p.anim)}|${esc(p.acc)}" width="${w || 48}" height="${h || 63}"></canvas>`; }
function hydrateAv(root, face) {
  root.querySelectorAll('canvas[data-av]').forEach(c => { const [a, ac] = c.dataset.av.split('|'); drawStatic(c, a, ac, c.dataset.face || face); });
}
function joinUrl(code) {
  let u = location.origin + location.pathname + '?sala=' + code;
  if (NET_LOCAL && URLP.has('local')) u += '&local=1';
  if (URLP.has('speed')) u += '&speed=' + URLP.get('speed');
  return u + PEER_PARAMS;
}
function makeQR(el, url) {
  el.innerHTML = '';
  if (typeof QRCode === 'undefined' || location.protocol === 'file:') { el.classList.add('hidden'); return; }
  try { new QRCode(el, { text: url, width: 256, height: 256, colorDark: '#0b1030', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); }
  catch (e) { el.classList.add('hidden'); }
}
function ranked(S) { return S.order.map(id => S.players[id]).filter(Boolean).sort((a, b) => b.score - a.score); }
function ordinal(n) { return n + '.º'; }

/* ---------- som ---------- */
const SFX = {
  ctx: null,
  unlock() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { } },
  tone(f, d, type, v, when) {
    if (!G.sound || !this.ctx) return;
    const t0 = this.ctx.currentTime + (when || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(v || .06, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0 + d + .02);
  },
  seq(notes, type, v) { notes.forEach(([f, d, w]) => this.tone(f, d, type, v, w)); },
  play(n) {
    if (!this.ctx) return;
    if (n === 'tick') this.tone(880, .07, 'square', .04);
    if (n === 'start') this.seq([[523, .1, 0], [784, .15, .1]], 'triangle', .08);
    if (n === 'ok') this.seq([[659, .12, 0], [784, .12, .1], [1047, .25, .2]], 'triangle', .09);
    if (n === 'bad') this.seq([[220, .18, 0], [165, .3, .15]], 'sawtooth', .05);
    if (n === 'coin') this.seq([[988, .08, 0], [1319, .25, .08]], 'square', .05);
    if (n === 'splat') this.seq([[140, .25, 0], [90, .3, .05]], 'sawtooth', .07);
    if (n === 'elim') this.seq([[440, .15, 0], [330, .15, .15], [220, .4, .3]], 'square', .05);
    if (n === 'win') this.seq([[523, .12, 0], [659, .12, .12], [784, .12, .24], [1047, .4, .36], [784, .12, .6], [1047, .6, .72]], 'triangle', .09);
    if (n === 'vote') this.tone(660, .06, 'triangle', .05);
    if (n === 'round') this.seq([[392, .12, 0], [523, .12, .12], [659, .3, .24]], 'triangle', .08);
  }
};

/* ---------- música de fundo (gerada no momento, sem ficheiros) ---------- */
const MUSIC = {
  on: (() => { try { return localStorage.getItem('ss_music') !== '0'; } catch (e) { return true; } })(),
  playing: false, mood: 'calm', step: 0, next: 0, timer: null, out: null, noise: null,
  MOODS: {
    calm:    { bpm: 92,  prog: [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]], hat: false, lead: 'sine' },
    tense:   { bpm: 138, prog: [[57, 60, 64], [55, 59, 62], [53, 57, 60], [52, 56, 59]], hat: true,  lead: 'square' },
    victory: { bpm: 108, prog: [[60, 64, 67], [55, 59, 62], [57, 60, 64], [53, 57, 60]], hat: true,  lead: 'triangle' }
  },
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  start() {
    const c = SFX.ctx;
    if (!c || !this.on || this.playing) return;
    this.out = c.createGain();
    this.out.gain.setValueAtTime(0, c.currentTime);
    this.out.gain.linearRampToValueAtTime(1, c.currentTime + 2.5);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    this.out.connect(lp); lp.connect(c.destination);
    if (!this.noise) {
      const b = c.createBuffer(1, c.sampleRate * 0.1, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
    }
    this.next = c.currentTime + 0.15; this.step = 0; this.playing = true;
    this.timer = setInterval(() => this.sched(), 90);
  },
  stop() {
    if (!this.playing) return;
    const c = SFX.ctx, o = this.out;
    clearInterval(this.timer); this.playing = false;
    try { o.gain.cancelScheduledValues(c.currentTime); o.gain.setValueAtTime(o.gain.value, c.currentTime); o.gain.linearRampToValueAtTime(0, c.currentTime + .6); } catch (e) { }
    setTimeout(() => { try { o.disconnect(); } catch (e) { } }, 800);
  },
  setMood(m) { if (this.MOODS[m]) this.mood = m; },
  tone(f, t, d, type, v) {
    const c = SFX.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + Math.min(.04, d / 4));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + d + .05);
  },
  sched() {
    const c = SFX.ctx;
    while (this.next < c.currentTime + 0.35) {
      const M = this.MOODS[this.mood], e = 60 / M.bpm / 2;   // duração de uma colcheia
      const pos = this.step % 8, ch = M.prog[Math.floor(this.step / 8) % 4], t = this.next;
      if (pos === 0) ch.forEach(n => this.tone(this.hz(n), t, e * 8, 'triangle', .018));       // acorde de fundo
      if (pos === 0 || pos === 4) this.tone(this.hz(ch[0] - 24), t, e * 3, 'sine', .07);        // baixo
      const arp = [0, 1, 2, 1, 2, 0, 1, 2][pos];
      this.tone(this.hz(ch[arp] + 12), t, e * 1.6, M.lead, M.lead === 'square' ? .012 : .028); // sininhos
      if (M.hat && pos % 2 === 1) {
        const s = c.createBufferSource(), g = c.createGain(), hp = c.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 7000;
        s.buffer = this.noise; g.gain.setValueAtTime(.025, t); g.gain.exponentialRampToValueAtTime(.0001, t + .05);
        s.connect(hp); hp.connect(g); g.connect(this.out); s.start(t); s.stop(t + .06);
      }
      this.next += e; this.step++;
    }
  }
};
function musicBtns() {
  ['tv-mus', 'ph-mus'].forEach(id => { const b = $(id); if (b) { b.textContent = MUSIC.on ? '🎵' : '🔕'; b.classList.toggle('off', !MUSIC.on); b.title = MUSIC.on ? 'Desligar a música' : 'Ligar a música'; } });
}
function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { } }

let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => (wakeLock = null)); } } catch (e) { } }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (G.role) keepAwake();
    if (G.role === 'ph' && !G.host && G.code && G.token && (!G.link || !G.link.open)) reconnectNow();
  }
});

(function snow() {
  const el = $('snow'), n = window.innerWidth < 700 ? 22 : 45;
  for (let i = 0; i < n; i++) {
    const f = document.createElement('div');
    const s = Math.random() * 3 + 1.5;
    f.className = 'flake';
    f.style.cssText = `left:${Math.random() * 100}vw;width:${s}px;height:${s}px;opacity:${.25 + Math.random() * .45};animation-duration:${8 + Math.random() * 10}s;animation-delay:-${Math.random() * 18}s;--dx:${Math.random() * 60 - 30}px`;
    el.appendChild(f);
  }
})();

const UI = {};
UI.show = showView;

function initHome() {
  const lb = $('logo-bonecos');
  ['gato', 'urso', 'sapo', 'raposa', 'pinguim'].forEach((a, i) => {
    const d = document.createElement('div');
    lb.appendChild(d);
    const ac = mountActor(d, 2, a, ['laco', 'coroa', 'nada', 'oculos', 'cachecol'][i]);
    setTimeout(function trick() { if (ac.dead) return; ac.play(TRICKS[Math.floor(Math.random() * TRICKS.length)]); setTimeout(trick, 3000 + Math.random() * 5000); }, 800 + i * 900);
  });
  try { const av = JSON.parse(localStorage.getItem('ss_av') || 'null'); if (av) G.av = Object.assign(G.av, av); } catch (e) { }
  const sess = getSess();
  const sala = (URLP.get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  if (sess && (!sala || sala === sess.code)) $('btn-resume').classList.remove('hidden');
  if (NET_LOCAL) $('home-note').textContent = URLP.has('local') ? 'Modo de teste local (várias abas no mesmo browser).' : 'Sem ligação ao servidor de jogo. Verifica a internet e recarrega a página.';
  if (sala) {
    $('join-code').value = sala;
    if (sess && sess.code === sala) UI.resume();
    else { showView('v-join'); UI.connect(); }

// no modo de teste local (várias abas no mesmo browser) cada aba guarda a sua sessão
const SESS_STORE = (() => { try { return URLP.has('local') ? sessionStorage : localStorage; } catch (e) { return null; } })();
function getSess() {
  try { const s = JSON.parse(SESS_STORE.getItem('ss_sess') || 'null'); if (s && Date.now() - s.ts < 4 * 3600e3) return s; } catch (e) { }
  return null;
}
function saveSess() { try { SESS_STORE.setItem('ss_sess', JSON.stringify({ code: G.code, token: G.token, ts: Date.now() })); } catch (e) { } }
function clearSess() { try { SESS_STORE.removeItem('ss_sess'); } catch (e) { } }

UI.goCreate = () => { SFX.unlock(); showView('v-create'); };
UI.goJoin = () => { SFX.unlock(); showView('v-join'); setTimeout(() => $('join-code').focus(), 50); };

function genCode() { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r = ''; for (let i = 0; i < 4; i++) r += c[Math.floor(Math.random() * c.length)]; return r; }

function startHosting(mode, done, tries) {
  tries = tries || 0;
  const code = genCode();
  G.peerHost = netHost(code, {
    ready() { G.code = code; engCreate(code, mode); ENG.onState = onState; done(code); },
    conn(L) { engOnConn(L); },
    error(type, msg) {
      if (type === 'taken' && tries < 5) return startHosting(mode, done, tries + 1);
      toast(msg || 'Não foi possível criar a sala.');
      showView('v-home');
    }
  });
  window.addEventListener('beforeunload', e => { if (ENG.S && ENG.S.order.length) { e.preventDefault(); e.returnValue = ''; } });
}

UI.createTV = () => {
  SFX.unlock(); keepAwake();
  toast('A criar a sala…', true);
  startHosting('tv', () => {
    G.role = 'tv'; G.host = true; G.mode = 'tv';
    document.body.classList.add('is-tv');
    musicBtns();
    $('toast').classList.add('hidden');
    showView('v-tv');
    engPush();
  });
};
UI.createMesa = () => { SFX.unlock(); G.pendingMesa = true; openAvatar(); };

UI.connect = () => {
  const code = $('join-code').value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  $('join-code').value = code;
  if (code.length !== 4) { toast('O código tem 4 caracteres.'); return; }
  if (G.joining) return;
  G.joining = true;
  const b = $('btn-connect'); b.disabled = true; b.textContent = 'A ligar…';
  SFX.unlock();
  netJoin(code, {
    open(L) { G.joining = false; G.link = L; G.code = code; b.disabled = false; b.textContent = 'Ligar'; G.pendingMesa = false; openAvatar(); },
    data: onMsg,
    close: onLost,
    fail(msg) { G.joining = false; b.disabled = false; b.textContent = 'Ligar'; toast(msg); showView('v-join'); }
  });
};

UI.resume = () => {
  const s = getSess();
  if (!s) return;
  G.code = s.code; G.token = s.token;
  showView('v-join'); $('join-code').value = s.code;
  const b = $('btn-connect'); b.disabled = true; b.textContent = 'A voltar ao jogo…';
  netJoin(s.code, {
    open(L) { G.link = L; b.disabled = false; b.textContent = 'Ligar'; L.send({ t: 'J', token: s.token, name: G.av.name, anim: G.av.anim, acc: G.av.acc }); },
    data: onMsg,
    close: onLost,
    fail(msg) { b.disabled = false; b.textContent = 'Ligar'; toast(msg); clearSess(); $('btn-resume').classList.add('hidden'); }
  });
};

/* ---------- criação da personagem ---------- */
let avActor = null;
function openAvatar() {
  showView('v-avatar');
  $('av-name').value = G.av.name || '';
  const ga = $('av-animals'); ga.innerHTML = '';
  ANIMAL_IDS.forEach(id => {
    const b = document.createElement('button');
    b.className = 'pick' + (id === G.av.anim ? ' sel' : '');
    b.title = ANIMALS[id].nome;
    b.appendChild(staticAv(id, 'nada', 'normal', 64, 84));
    b.onclick = () => { G.av.anim = id; ga.querySelectorAll('.pick').forEach(x => x.classList.toggle('sel', x === b)); refreshAccPicks(); avActor.set({ a: id }); avActor.play('saltar'); };
    ga.appendChild(b);
  });
  refreshAccPicks();
  const pv = $('av-preview'); pv.innerHTML = '';
  avActor = mountActor(pv, 6, G.av.anim, G.av.acc);
}
function refreshAccPicks() {
  const gc = $('av-accs'); gc.innerHTML = '';
  ACCS.forEach(([id, nome]) => {
    const b = document.createElement('button');
    b.className = 'pick' + (id === G.av.acc ? ' sel' : '');
    b.title = nome;
    if (id === 'nada') b.innerHTML = '<span class="none">NADA</span>';
    else b.appendChild(staticAv(G.av.anim, id, 'normal', 64, 84));
    b.onclick = () => { G.av.acc = id; gc.querySelectorAll('.pick').forEach(x => x.classList.toggle('sel', x === b)); avActor.set({ ac: id }); avActor.play('virar'); };

  });

UI.avTrick = () => { if (avActor) avActor.play(TRICKS[Math.floor(Math.random() * TRICKS.length)]); };
UI.avReady = () => {
  const name = $('av-name').value.replace(/\s+/g, ' ').trim().slice(0, 12);
  if (!name) { toast('Escreve o teu nome!'); $('av-name').focus(); return; }
  G.av.name = name;
  try { localStorage.setItem('ss_av', JSON.stringify(G.av)); } catch (e) { }
  keepAwake();
  if (G.pendingMesa) {
    $('btn-ready').disabled = true;
    toast('A criar a sala…', true);
    startHosting('mesa', () => {
      $('btn-ready').disabled = false;
      $('toast').classList.add('hidden');
      G.role = 'ph'; G.host = true; G.mode = 'mesa';
      G.me = engAddLocal(G.av);
      $('ph-mus').classList.remove('hidden'); musicBtns();
      showView('v-ph');
      engPush();
    });
    return;
  }
  if (!G.link || !G.link.open) { toast('A ligação caiu. Tenta entrar outra vez.'); showView('v-join'); return; }
  $('btn-ready').disabled = true;
  G.link.send({ t: 'J', token: G.token, name: G.av.name, anim: G.av.anim, acc: G.av.acc });
  setTimeout(() => ($('btn-ready').disabled = false), 2000);
};

/* ---------- mensagens do anfitrião ---------- */
function onMsg(d) {
  if (!d) return;
  if (d.t === 'W') {
    G.me = d.pid; G.token = d.token; G.code = d.code; G.mode = d.mode;
    G.role = 'ph'; G.reconn = 0;
    saveSess();
    $('netbar').classList.add('hidden');
    showView('v-ph');
  } else if (d.t === 'S') {
    if (G.role === 'ph' && G.me) onState(d.s);
  } else if (d.t === 'E') {
    toast(d.msg);
    if (d.kick) { clearSess(); G.me = null; G.role = null; showView('v-home'); }
    else if (!G.me) { clearSess(); showView('v-join'); }
  }
}

// sinal de vida para o anfitrião saber que o telemóvel continua ligado
setInterval(() => { if (!G.host && G.me && G.link && G.link.open) G.link.send({ t: 'P' }); }, 4000);

function send(m) {
  if (G.host) { if (G.me) engMsg(G.me, m); }
  else if (G.link && G.link.open) G.link.send(m);
}
UI.hostAct = (a, d) => { if (G.host) { SFX.unlock(); engAction(a, d || {}); } };

function onLost() {
  if (G.host || !G.code) return;
  if (!G.me) { toast('A ligação falhou. Tenta outra vez.'); showView('v-join'); return; }
  $('netbar').textContent = '📡 Ligação perdida… a tentar voltar ao jogo';
  $('netbar').classList.remove('hidden');
  clearTimeout(G.reconnTimer);
  G.reconnTimer = setTimeout(reconnectNow, 1500);
}
function reconnectNow() {
  clearTimeout(G.reconnTimer);
  if (G.reconnBusy) return;
  G.reconnBusy = true;
  G.reconn++;
  netJoin(G.code, {
    open(L) { G.reconnBusy = false; G.link = L; L.send({ t: 'J', token: G.token, name: G.av.name, anim: G.av.anim, acc: G.av.acc }); },
    data: onMsg,
    close: () => { G.reconnBusy = false; onLost(); },
    fail(msg) {
      G.reconnBusy = false;
      if (G.reconn < 25) { G.reconnTimer = setTimeout(reconnectNow, 3000); }
      else { $('netbar').innerHTML = 'Não foi possível voltar ao jogo. <button class="btn btn-sm btn-ghost" onclick="location.href=location.pathname">Início</button>'; }
    }
  });
}

/* =========================================================
   RENDER
   ========================================================= */
function onState(S) {
  const P = G.S;
  G.S = S;
  if (G.role === 'tv') renderTV(S, P); else renderPh(S, P);
  handleFeed(S, P);
  if (G.role === 'tv' || (G.host && G.mode === 'mesa')) sounds(S, P);
}

function handleFeed(S, P) {
  const items = S.feed || [];
  if (G.seenFeed < 0 || !P) { G.seenFeed = items.length ? items[items.length - 1].id : 0; return; }
  for (const it of items) {
    if (it.id <= G.seenFeed) continue;
    G.seenFeed = it.id;
    const mine = it.a === G.me || it.b === G.me;
    const showIt = G.role === 'tv' || G.mode === 'mesa' || mine || it.kind === 'win';
    if (showIt) showFeed(it.txt);
    if (it.kind === 'roubo') { reactPid(it.a, 'saltar'); reactPid(it.b, 'atingido'); if (it.b === G.me) vib([80, 60, 80]); }
    if (it.kind === 'roubo0') reactPid(it.a, 'abanar');
    if (it.kind === 'ink' || it.kind === 'pie') reactPid(it.b, 'atingido');
    if (it.kind === 'elim') reactPid(it.a, 'cair', true);
    if (G.role === 'tv' || (G.host && G.mode === 'mesa')) {
      if (it.kind === 'roubo') SFX.play('coin');
      if (it.kind === 'ink' || it.kind === 'pie') SFX.play('splat');
      if (it.kind === 'elim') SFX.play('elim');
    }
  }
}
function showFeed(txt) {
  const f = $('feed');
  const d = document.createElement('div');
  d.className = 'feed-it'; d.textContent = txt;
  f.appendChild(d);
  while (f.children.length > 2) f.firstChild.remove();
  setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 450); }, 3200);
}

function sounds(S, P) {
  // música: calma nas rondas, tensa na final, festiva no fim
  MUSIC.setMood(['FINTRO', 'FQ', 'FREV'].includes(S.phase) ? 'tense' : S.phase === 'END' ? 'victory' : 'calm');
  if (MUSIC.on && !MUSIC.playing) MUSIC.start();
  if (!P) return;
  const ph = S.phase, pph = P.phase;
  if ((ph === 'Q' || ph === 'FQ') && pph !== ph) SFX.play('start');
  if ((ph === 'Q' || ph === 'FQ') && S.t !== P.t && S.t <= 3 && S.t > 0) SFX.play('tick');
  if ((ph === 'REVEAL' || ph === 'FREV') && pph !== ph) {
    const any = S.order.some(id => S.players[id] && S.players[id].last && S.players[id].last.ok);
    SFX.play(any ? 'ok' : 'bad');
  }
  if (ph === 'INTRO' && pph !== ph) SFX.play('round');
  if (ph === 'FINTRO' && pph !== ph) SFX.play('round');
  if (ph === 'END' && pph !== ph) SFX.play('win');
  if (ph === 'VOTE' && P.vote && S.vote && S.vote.cnt.join() !== P.vote.cnt.join()) SFX.play('vote');
}

/* ---------- bonecos: reações e expressões ---------- */
const ALL_ACTORS = []; // {pid, actor, ctx}
function regActor(pid, actor) { ALL_ACTORS.push({ pid, actor }); }
function reactPid(pid, anim, force) {
  for (let i = ALL_ACTORS.length - 1; i >= 0; i--) {
    const r = ALL_ACTORS[i];
    if (r.actor.dead) { ALL_ACTORS.splice(i, 1); continue; }
    if (r.pid === pid) r.actor.play(anim, force ? false : undefined);
  }
}
function exprFor(S, p) {
  if (!p.on) return 'dormir';
  if (S.fin && !p.alive) return 'triste';
  if (S.phase === 'END') return p.id === S.winner ? 'feliz' : 'normal';
  if (S.phase === 'FQ' || S.phase === 'FREV') return p.time <= 10 ? 'panico' : (p.ans ? 'normal' : 'pensar');
  if (S.phase === 'Q') return p.ans ? 'normal' : 'pensar';
  if (S.phase === 'ATTACK') return 'zangado';
  if (S.phase === 'BET') return 'pensar';
  return 'normal';
}
function syncActor(holder, S, p) {
  const a = holder.actor;
  a.set({
    a: p.anim, ac: p.acc, expr: exprFor(S, p),
    dim: !p.on || (S.fin && !p.alive),
    fx: S.phase === 'Q' && p.hit && !p.hit.cleared ? p.hit.w : null
  });
  // reação ao resultado
  let rk = null, anim = null;
  if ((S.phase === 'REVEAL' || S.phase === 'FREV') && p.last && S.q) {
    rk = 'r' + S.q.k;
    if (S.phase === 'FREV' && !p.alive) anim = 'cair';
    else if (p.last.ok) anim = S.style === 'vf' ? 'feliz' : (p.last.first || p.streak >= 3 ? 'cambalhota' : (Math.random() < .5 ? 'saltar' : 'dancar'));
    else if (p.last.ok === false) anim = 'errou';
    else anim = 'abanar';
  } else if (S.phase === 'END') {
    rk = 'end';
    anim = p.id === S.winner ? 'dancar' : null;
  } else if (S.phase === 'LOBBY') {
    rk = 'lobby'; anim = 'saltar';
  } else if (S.phase === 'INTRO') {
    rk = 'intro' + S.round; anim = Math.random() < .5 ? 'virar' : null;
  }
  if (rk && holder.rk !== rk) {
    holder.rk = rk;
    if (anim) {
      if (S.phase === 'END' && p.id === S.winner) a.play('dancar', true);
      else { a.loopAnim = null; a.play(anim); }
    } else if (S.phase === 'END') { a.loopAnim = null; }
  }
  if (S.phase !== 'END' && a.loopAnim) a.loopAnim = null;
}
function showDelta(card, txt, pos) {
  const d = document.createElement('div');
  d.className = 'delta ' + (pos ? 'pos' : 'neg');
  d.textContent = txt;
  card.appendChild(d);
  setTimeout(() => d.remove(), 2300);
}

/* ---------- tira de jogadores (TV e mini) ---------- */
function syncCards(el, S, kind) {
  const map = G.cards[kind] || (G.cards[kind] = {});
  const ids = S.order;
  for (const pid in map) {
    if (!ids.includes(pid) || !map[pid].root.isConnected) { map[pid].actor.destroy(); map[pid].root.remove(); delete map[pid]; }
  }
  const lobby = S.phase === 'LOBBY';
  ids.forEach((pid, idx) => {
    const p = S.players[pid];
    let c = map[pid];
    if (!c) {
      const root = document.createElement('div');
      root.className = kind === 'tv' ? 'glass pcard' : 'm';
      root.innerHTML = '<div class="act"></div><div class="nm"></div><div class="sc"></div><div class="st"></div>' + (kind === 'tv' ? '<div class="tbarp hidden"><i></i></div>' : '');
      el.appendChild(root);
      c = { root, actEl: root.querySelector('.act'), nm: root.querySelector('.nm'), sc: root.querySelector('.sc'), st: root.querySelector('.st'), bar: root.querySelector('.tbarp') };
      c.actor = mountActor(c.actEl, kind === 'tv' ? 5 : 2, p.anim, p.acc);
      regActor(pid, c.actor);
      map[pid] = c;
    }
    if (el.children[idx] !== c.root) el.insertBefore(c.root, el.children[idx] || null);
    c.nm.textContent = p.name + (pid === G.me && kind !== 'tv' ? ' (tu)' : '');
    const fin = S.fin && ['FINTRO', 'FQ', 'FREV', 'END'].includes(S.phase);
    c.sc.textContent = fin && S.phase !== 'END' ? p.time + 's' : p.score;
    if (c.bar) {
      c.bar.classList.toggle('hidden', !fin || S.phase === 'END');
      if (fin) { const i = c.bar.firstChild; i.style.width = Math.min(100, p.time / FINAL_MAX * 100) + '%'; i.classList.toggle('low', p.time <= 10); }
    }
    let st = '';
    if (!p.on) st = '📵';
    else if (S.fin && !p.alive) st = '💀';
    else if (S.phase === 'VOTE' && p.voted) st = '🗳️';
    else if (S.phase === 'ATTACK' && p.atk) st = '😈';
    else if (S.phase === 'BET' && p.bet != null) st = '💰';
    else if (S.phase === 'Q' && p.hit && !p.hit.cleared) st = p.hit.w === 'ink' ? '🖤' : '🥧';
    else if ((S.phase === 'Q' || S.phase === 'FQ') && p.ans) st = '✅';
    else if (S.phase === 'END' && pid === S.winner) st = '👑';
    c.st.textContent = st;
    c.root.classList.toggle('off', !p.on);
    c.root.classList.toggle('done', !!st && st !== '📵' && st !== '💀');
    // expulsar (só no lobby, no ecrã do anfitrião)
    let k = c.root.querySelector('.kick');
    if (lobby && G.host && kind === 'tv' && pid !== G.me) {
      if (!k) { k = document.createElement('button'); k.className = 'kick'; k.textContent = '×'; k.title = 'Remover'; k.onclick = () => UI.hostAct('kick', { pid }); c.root.appendChild(k); }
    } else if (k) k.remove();
    // pontos ganhos/perdidos
    if ((S.phase === 'REVEAL' || S.phase === 'FREV') && p.last && S.q && c.dk !== S.q.k) {
      c.dk = S.q.k;
      if (S.phase === 'FREV') { if (p.last.dt) showDelta(c.root, p.last.dt + 's', false); }
      else if (p.last.pts) showDelta(c.root, (p.last.pts > 0 ? '+' : '') + p.last.pts, p.last.pts > 0);
    }
    syncActor(c, S, p);
  });
}

/* ---------- bloco da pergunta (TV e palco do telemóvel) ---------- */
function qKeyOf(S) { return S.q ? S.q.k : ''; }
function buildQ(el, S, compact) {
  const q = S.q;
  const meta = S.phase === 'FQ' || S.phase === 'FREV' ? 'Pergunta ' + q.n + ' · ' + esc(q.cat) : 'Pergunta ' + q.n + ' de ' + q.of + ' · ' + esc(q.cat);
  let h = `<div class="qwrap ${compact ? '' : 'fade'}"><div class="${compact ? '' : 'glass '}qbox">${compact ? '' : '<div class="tbar"><i></i></div>'}<div class="qmeta">${meta}</div>`;
  if (q.kind === 'emo') h += `<div class="qemo">${esc(q.emo)}</div>`;
  h += `<div class="qtext">${esc(q.text)}</div>`;
  if (q.kind === 'pis') h += `<div class="clues">${[0, 1, 2].map(i => `<div class="clue wait" data-c="${i}"><i>PISTA ${i + 1}</i><span></span></div>`).join('')}</div>`;
  h += '</div>';
  if (!compact) {
    const vf = q.kind === 'vf';
    h += `<div class="answers ${vf ? 'two' : ''}">` + q.ans.map((a, i) => `<div class="ans ${vf ? (i ? 'cf' : 'cv') : 'c' + i}" data-i="${i}"><span class="sh">${vf ? (i ? '✖' : '✔') : SHAPES[i]}</span><span class="tx"></span><div class="who"></div></div>`).join('') + '</div>';
  }
  h += '</div>';
  el.innerHTML = h;
}
function updQ(el, S) {
  const q = S.q;
  if (!q) return;
  const bar = el.querySelector('.tbar i');
  if (bar) bar.style.width = (S.tMax ? Math.max(0, S.t / S.tMax) * 100 : 0) + '%';
  if (q.kind === 'pis') {
    el.querySelectorAll('.clue').forEach(c => {
      const i = +c.dataset.c, has = q.clues && q.clues[i] != null;
      c.classList.toggle('wait', !has);
      c.querySelector('span').textContent = has ? q.clues[i] : '…';
    });
  }
  const rev = q.correct != null;
  el.querySelectorAll('.ans').forEach(a => {
    const i = +a.dataset.i, tx = a.querySelector('.tx');
    if (tx.textContent !== q.ans[i]) tx.textContent = q.ans[i];
    tx.classList.toggle('masked', !!q.masked);
    a.classList.toggle('right', rev && i === q.correct);
    a.classList.toggle('dim', rev && i !== q.correct);
    const who = a.querySelector('.who');
    const wk = rev ? 'w' + q.k : '';
    if (who.dataset.k !== wk) {
      who.dataset.k = wk; who.innerHTML = '';
      if (rev && q.picks) for (const pid in q.picks) if (q.picks[pid] === i && S.players[pid]) {
        const p = S.players[pid];
        who.appendChild(staticAv(p.anim, p.acc, i === q.correct ? 'feliz' : 'triste', 40, 48));
      }
    }
  });
}
